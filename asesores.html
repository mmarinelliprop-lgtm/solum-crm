<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLUMITOS — Mi Seguimiento</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2317355B%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23B6A284%22 font-family=%22Georgia,serif%22>S</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  color-scheme:dark;
  --w:255,255,255;
  --navy:#1b3a52;--navy2:rgba(95,127,166,.32);--navy3:#14293a;
  --gold:#E3C98A;--gold2:#E3C98A;--gold3:rgba(227,201,138,.55);
  --on-gold:#0b1a26;
  --bg:#0b1a26;--bg2:#10222f;--bg3:#16303f;
  --card:rgba(18,32,48,.58);--card2:rgba(255,255,255,.06);--card3:rgba(255,255,255,.10);
  --pop:#13273a;
  --border:rgba(255,255,255,.14);--edge:rgba(255,255,255,.14);
  --text:#ffffff;--text2:#cbd5e1;--text3:#94A3B8;
  --green:#2DD4C4;--greenbg:rgba(45,212,196,.15);
  --amber:#D9B25C;--amberbg:rgba(217,178,92,.16);
  --red:#FF4FA0;--redbg:rgba(255,79,160,.16);
  --blue:#7FA6D6;--bluebg:rgba(95,127,166,.22);
  --lila:#A596C4;--bronce:#B9794A;
  --radius:12px;--radius2:20px;
  --glass-blur:blur(18px) saturate(140%);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.35);
  --bokeh-a:linear-gradient(135deg,#0a1b27 0%,#12303c 45%,#0c1822 100%);
  --bokeh-op:.55;
}
*{scrollbar-width:thin;scrollbar-color:var(--gold3) var(--bg2);}
*::-webkit-scrollbar{height:9px;width:9px;}
*::-webkit-scrollbar-track{background:var(--bg2);border-radius:6px;}
*::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:6px;}
body{font-family:'Montserrat','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;}
.bokeh{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bokeh-a);pointer-events:none;}
.bokeh i{position:absolute;border-radius:50%;filter:blur(22px);opacity:var(--bokeh-op);}
.bokeh .metatron{position:absolute;pointer-events:none;}
.header{background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--edge);box-shadow:var(--glass-shadow);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.header-brand{display:flex;align-items:center;gap:12px;}
.header-logo{width:38px;height:38px;color:var(--gold);padding:3px;flex:none;}
.header-logo svg{width:100%;height:100%;display:block;}
.header-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:.03em;}
.header-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.btn{padding:8px 16px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--bronce));color:var(--on-gold);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.tabs{display:flex;gap:0;background:var(--card);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--edge);overflow-x:auto;}
.tab-btn{padding:13px 20px;background:none;border:none;color:var(--text3);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--gold2);border-bottom-color:var(--gold);background:rgba(var(--w),.05);}
.content{padding:18px 26px;max-width:1360px;margin:0 auto;width:100%;}
.hidden{display:none!important;}
.card{background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--edge);box-shadow:var(--glass-shadow);border-radius:var(--radius2);padding:20px;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:700;color:var(--gold2);margin-bottom:12px;}
.filter-select,.inp{background:var(--pop);color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:8px;font-size:13px;outline:none;width:100%;}
.filter-select:focus,.inp:focus{border-color:var(--gold3);}
.filter-select option,.inp option{background:var(--pop);color:var(--text);}
::placeholder{color:var(--text3);opacity:1;}
.kpi-tile{background:var(--pop);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.kpi-tile .kt-l{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);font-weight:700;}
.kpi-tile .kt-v{font-size:17px;font-weight:800;margin-top:3px;}
.kpi-bar-wrap{height:5px;border-radius:4px;background:rgba(var(--w),.1);overflow:hidden;margin-top:7px;}
.kpi-bar{height:100%;border-radius:4px;}
.kpi-obj{font-size:8px;color:var(--text3);margin-top:3px;}
.pep-banner{border-radius:16px;padding:14px 18px;margin-bottom:16px;font-size:13px;font-weight:700;text-align:center;}
.pep-good{background:linear-gradient(135deg,rgba(45,212,196,.16),rgba(45,212,196,.04));border:1px solid rgba(45,212,196,.3);color:var(--green);}
.pep-mid{background:linear-gradient(135deg,rgba(227,201,138,.16),rgba(227,201,138,.04));border:1px solid rgba(227,201,138,.3);color:var(--gold2);}
.pep-low{background:linear-gradient(135deg,rgba(255,79,160,.14),rgba(255,79,160,.04));border:1px solid rgba(255,79,160,.3);color:var(--red);}
.semanas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start;}
.login-box{max-width:380px;margin:70px auto;background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--edge);box-shadow:var(--glass-shadow);border-radius:var(--radius2);padding:30px;text-align:center;position:relative;z-index:1;}
.login-box .logo{width:52px;height:52px;margin:0 auto 10px;color:var(--gold);}
.login-box .logo svg{width:100%;height:100%;display:block;}
.login-box label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;text-align:left;}
.week-card{background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--edge);box-shadow:var(--glass-shadow);border-radius:14px;padding:13px 15px;margin-bottom:0;}
.week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;flex-wrap:wrap;gap:4px;}
.week-range{font-size:10px;color:var(--text3);}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.metric-tile label{display:block;font-size:9px;color:var(--text3);margin-bottom:3px;}
.metric-tile input{width:100%;background:var(--pop);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:13px;font-weight:700;text-align:center;}
.accion-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;}
.accion-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--gold);}
.accion-item.done span{color:var(--text3);text-decoration:line-through;}
.accion-add{display:flex;gap:6px;margin-top:8px;}
.accion-add input{flex:1;}
.chip{display:inline-flex;align-items:center;justify-content:center;padding:5px 11px;border-radius:14px;font-size:10.5px;font-weight:700;border:1px solid var(--border);color:var(--text3);background:var(--card2);cursor:pointer;}
.chip.on{background:var(--green);color:#06241f;border-color:var(--green);}
.capt-card,.consulta-card{background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--edge);box-shadow:var(--glass-shadow);border-radius:14px;padding:14px;margin-bottom:10px;}
.tag{font-size:9px;font-weight:700;padding:3px 9px;border-radius:10px;}
.tag.prop{background:var(--bluebg);color:var(--blue);}
.tag.busq{background:var(--amberbg);color:var(--amber);}
.tag.ambas{background:rgba(165,150,196,.2);color:var(--lila);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);backdrop-filter:var(--glass-blur);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12px;border:1px solid var(--edge);z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div class="bokeh" id="bokeh"></div>

<div id="screen-login">
  <div class="login-box">
    <div class="logo"><svg viewBox="0 0 720 600" fill="none" stroke="currentColor" stroke-width="34" stroke-linejoin="miter"><path d="M50 566V432L302 52L452 202L215 555"/><path d="M122 555V440L302 178L682 555"/><path d="M39 555H692"/></svg></div>
    <div style="font-size:19px;font-weight:800;color:var(--text);letter-spacing:.03em">SOLUMITOS</div>
    <div style="font-size:11px;color:var(--text3);margin-top:2px">Mi seguimiento semanal</div>
    <label>Tu nombre</label>
    <select class="filter-select" id="login-nombre"></select>
    <label>PIN (4 dígitos)</label>
    <input class="inp" id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="err" id="login-err"></div>
    <button class="btn btn-gold" style="width:100%;margin-top:14px" onclick="intentarLogin()">Entrar</button>
  </div>
</div>

<div id="screen-app" class="hidden">
  <div class="header">
    <div class="header-brand">
      <div class="header-logo"><svg viewBox="0 0 720 600" fill="none" stroke="currentColor" stroke-width="34" stroke-linejoin="miter"><path d="M50 566V432L302 52L452 202L215 555"/><path d="M122 555V440L302 178L682 555"/><path d="M39 555H692"/></svg></div>
      <div><div class="header-name" id="header-greeting"></div><div class="header-sub">Cargá tu semana, tus captaciones y tus búsquedas — solo vos ves esto</div></div>
    </div>
    <button class="btn btn-outline" onclick="salir()">Salir</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-semana-btn" onclick="switchTab('semana')">📅 Mi semana</button>
    <button class="tab-btn" id="tab-capt-btn" onclick="switchTab('capt')">📋 Mis captaciones</button>
    <button class="tab-btn" id="tab-busq-btn" onclick="switchTab('busq')">🔎 Mis búsquedas</button>
  </div>

  <div class="content" id="content-semana">
    <div id="pep-banner"></div>
    <div class="card-title" style="padding-left:2px">Cómo vas este mes</div>
    <div class="metric-grid" id="kpi-wrap" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:18px"></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div class="card-title" style="margin-bottom:0">Mes</div>
        <select class="filter-select" id="sem-mes-sel" style="width:auto" onchange="renderSemana()"></select>
      </div>
    </div>
    <div id="semanas-wrap" class="semanas-grid"></div>
  </div>

  <div class="content hidden" id="content-capt">
    <div class="card">
      <div class="card-title">+ Nueva captación</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
        <input class="inp" id="nc-cliente" placeholder="Nombre del propietario">
        <input class="inp" id="nc-direccion" placeholder="Dirección">
        <input class="inp" id="nc-tipo" placeholder="Tipo (Casa/Depto/Local)">
        <input class="inp" id="nc-zona" placeholder="Zona/barrio">
        <input class="inp" id="nc-precio" type="number" placeholder="Precio USD">
        <input class="inp" id="nc-dorm" type="number" placeholder="Dormitorios">
      </div>
      <button class="btn btn-gold" style="margin-top:10px" onclick="crearCaptacionAsesor()">Agregar captación</button>
    </div>
    <div id="capt-wrap"></div>
  </div>

  <div class="content hidden" id="content-busq">
    <div class="card">
      <div class="card-title">+ Nueva búsqueda</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
        <input class="inp" id="nb-cliente" placeholder="Nombre del cliente">
        <input class="inp" id="nb-tipo" placeholder="Tipo (Casa/Depto/Local)">
        <input class="inp" id="nb-zona" placeholder="Zona/barrio que busca">
        <input class="inp" id="nb-precio" type="number" placeholder="Presupuesto USD">
        <input class="inp" id="nb-dorm" type="number" placeholder="Dormitorios">
      </div>
      <input class="inp" id="nb-detalle" placeholder="Otros detalles de lo que busca" style="margin-top:10px">
      <button class="btn btn-gold" style="margin-top:10px" onclick="crearBusquedaAsesor()">Agregar búsqueda</button>
    </div>
    <div id="busq-wrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// Mismo backend y mismas estructuras de datos que index.html (app principal).
// Cada asesor ve y edita ÚNICAMENTE lo suyo (filtrado por agente === sesión activa).
// ═══════════════════════════════════════════════
const DB_URL = '/.netlify/functions/sheets';
// value = nombre con el que se guarda el dato (debe coincidir con el "agente" usado en index.html);
// label = cómo se muestra en el selector de login.
const ASESORES = [
  {value:'Kito',    label:'Kito'},
  {value:'Vicky',   label:'Vicky'},
  {value:'Manu',    label:'Manu'},
  {value:'Marce',   label:'Marce'},
  {value:'Ceci',    label:'Ceci'},
  {value:'Luli',    label:'Lulita'},
  {value:'Joaquin', label:'Nano'},
];
// PINs de arranque — cualquiera de los 7 puede pedirle a Martina que se los cambie.
const PINES = {Kito:'1001',Vicky:'1002',Manu:'1003',Marce:'1004',Ceci:'1005',Luli:'1006',Joaquin:'1007'};
const MESES_NOMBRES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let sesionActiva = null;

document.getElementById('login-nombre').innerHTML = ASESORES.map(a=>`<option value="${a.value}">${a.label}</option>`).join('');
function labelDe(value){ return ASESORES.find(a=>a.value===value)?.label || value; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function dbGuardar(tipo, fila){
  try{ await fetch(DB_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo,accion:'guardar',fila})}); }
  catch(e){ console.error('dbGuardar error:', e); }
}
async function dbLeer(tipo){
  try{
    const r = await fetch(DB_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo,accion:'leer'})});
    const d = await r.json();
    return (d.ok && d.datos) ? d.datos : [];
  }catch(e){ return []; }
}
function fechaHoyDDMM(){ const h=new Date(); return String(h.getDate()).padStart(2,'0')+'/'+String(h.getMonth()+1).padStart(2,'0')+'/'+h.getFullYear(); }

function intentarLogin(){
  const nombre = document.getElementById('login-nombre').value;
  const pin = document.getElementById('login-pin').value.trim();
  if(pin !== PINES[nombre]){
    document.getElementById('login-err').textContent = 'PIN incorrecto';
    return;
  }
  sesionActiva = nombre;
  sessionStorage.setItem('asesorSesion', nombre);
  entrarApp();
}
function salir(){
  sesionActiva = null;
  sessionStorage.removeItem('asesorSesion');
  document.getElementById('screen-app').classList.add('hidden');
  document.getElementById('screen-login').classList.remove('hidden');
  document.getElementById('login-pin').value = '';
}
async function entrarApp(){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-app').classList.remove('hidden');
  document.getElementById('header-greeting').textContent = `Hola ${labelDe(sesionActiva)} 👋`;
  const mesHoy = new Date().getMonth()+1;
  const selMes = document.getElementById('sem-mes-sel');
  selMes.innerHTML = MESES_NOMBRES.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===mesHoy?'selected':''}>${m}</option>`).join('');
  await cargarTodo();
  renderKpisYMotivacion();
  renderSemana();
  renderCaptaciones();
  renderBusquedas();
}

function switchTab(tab){
  ['semana','capt','busq'].forEach(t=>{
    document.getElementById('tab-'+t+'-btn').classList.toggle('active', t===tab);
    document.getElementById('content-'+t).classList.toggle('hidden', t!==tab);
  });
}

// ── Carga inicial: semanas propias, captaciones propias, búsquedas propias, clientes ──
let segData = {}; // {mes: {semanas:[{fecha,vals}]}}  — solo del asesor logueado
let segAcciones = {}; // {mes: {semIdx: {accionId:{texto,cumplida}}}}
let clientes = [];
let captaciones = [];
let busquedas = [];
let operacionesPropias = []; // solo las del asesor logueado, leídas de la misma tabla "operaciones" que usa Martina

// Mismo mapeo de nombres que usa index.html al leer la tabla "operaciones" de Sheets.
const MAP_AGENTE_OPS = {
  'Martina Marinelli':'Martina','Propia':'Martina','propia':'Martina','':'Martina',
  'M. Victoria':'Vicky','Victoria':'Vicky','Maria Victoria':'Vicky','María Victoria':'Vicky',
  'Maria Victoria Saire':'Vicky','María Victoria Saire':'Vicky',
  'Manuela':'Manu','Manuela Pellegrini':'Manu',
  'Marcela':'Marce','Marcela Corsalini':'Marce',
  'Esteban':'Kito','Esteban Romero':'Kito',
  'Cristian':'Cris','Cristian Ruiz Diaz':'Cris',
  'Cecilia':'Ceci','Cecilia Bruno':'Ceci',
};
function parseFechaDDMM(f){
  if(!f) return null;
  const partes = String(f).trim().split('/');
  if(partes.length!==3) return null;
  const dia=parseInt(partes[0]), mes=parseInt(partes[1]), anio=parseInt(partes[2]);
  if(!dia||!mes||!anio) return null;
  return new Date(anio, mes-1, dia);
}
function normFechaOp(f){
  if(!f) return '';
  const s = String(f).trim();
  if(!s) return '';
  if(s.includes('T') || /^\d{4}-\d{2}-\d{2}/.test(s)){
    const d = new Date(s);
    if(!isNaN(d.getTime())) return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    return '';
  }
  return s;
}

async function cargarTodo(){
  const [semRows, accRows, clienteRows, captRows, busqRows, opRows] = await Promise.all([
    dbLeer('seguimiento_semanal'), dbLeer('seguimiento_acciones'), dbLeer('clientes'), dbLeer('captaciones'), dbLeer('busquedas'), dbLeer('operaciones')
  ]);

  if(semRows.length>1) semRows.slice(1).forEach(r=>{
    const vendedor=r[1], mes=parseInt(r[2]), semIdx=parseInt(r[3]), key=r[4], val=parseFloat(r[5])||0;
    if(vendedor!==sesionActiva || isNaN(mes) || isNaN(semIdx) || !key) return;
    if(!segData[mes]) segData[mes]={semanas:[]};
    while(segData[mes].semanas.length<=semIdx) segData[mes].semanas.push({fecha:'',vals:{}});
    if(key==='fecha') segData[mes].semanas[semIdx].fecha = val;
    else segData[mes].semanas[semIdx].vals[key] = val;
  });

  if(accRows.length>1) accRows.slice(1).forEach(r=>{
    const [ts,vendedor,mes,semIdx,accionId,texto,cumplida] = r;
    if(vendedor!==sesionActiva || !accionId) return;
    if(!segAcciones[mes]) segAcciones[mes]={};
    if(!segAcciones[mes][semIdx]) segAcciones[mes][semIdx]={};
    if(texto===''||texto===undefined) delete segAcciones[mes][semIdx][accionId];
    else segAcciones[mes][semIdx][accionId] = {texto, cumplida: cumplida===true||cumplida==='true'};
  });

  if(clienteRows.length>1){
    const porId={};
    clienteRows.slice(1).forEach(r=>{ const [id,nombre,cuit,mail,telefono,agente,fechaAlta,notas]=r; if(id) porId[id]={id,nombre,cuit,mail,telefono,agente,fechaAlta,notas}; });
    clientes = Object.values(porId);
  }
  if(captRows.length>1){
    const porId={};
    captRows.slice(1).forEach(r=>{
      const [id,clienteId,agente,direccion,tipo,zona,precioUSD,dormitorios,fechaInicio,fechaPublicacion,prelisting,acm,documentacion,fotos,publicacion,estado,fechaCierre,motivoCierre]=r;
      if(!id || agente!==sesionActiva) return;
      porId[id]={id,clienteId,agente,direccion,tipo,zona,precioUSD:parseFloat(precioUSD)||0,fechaInicio,fechaPublicacion,
        prelisting:prelisting===true||prelisting==='true', acm:acm===true||acm==='true', documentacion:documentacion===true||documentacion==='true',
        fotos:fotos===true||fotos==='true', publicacion:publicacion===true||publicacion==='true', estado:estado||'activa', fechaCierre, motivoCierre};
    });
    captaciones = Object.values(porId);
  }
  if(busqRows.length>1){
    const porId={};
    busqRows.slice(1).forEach(r=>{
      const [id,clienteId,agente,tipoPunta,propiedadRelacionada,criterios,muestrasJSON,estado,fechaReserva,fechaEscritura,fechaDescarte,motivoDescarte,tipo,zona,precioUSD,dormitorios]=r;
      if(!id || agente!==sesionActiva) return;
      let muestras=[]; try{ muestras=JSON.parse(muestrasJSON||'[]'); }catch(e){}
      porId[id]={id,clienteId,agente,tipoPunta,propiedadRelacionada,criterios,muestras,estado,fechaReserva,fechaEscritura,fechaDescarte,motivoDescarte,
        tipo:tipo||'', zona:zona||'', precioUSD:parseFloat(precioUSD)||0, dormitorios:parseInt(dormitorios)||0};
    });
    busquedas = Object.values(porId);
  }
  if(opRows.length>1){
    operacionesPropias = opRows.slice(1).map(r=>{
      let agente = String(r[2]||'').trim();
      agente = MAP_AGENTE_OPS[agente] || agente;
      const fechaEsc = normFechaOp(r[9]);
      const fechaReserva = normFechaOp(r[10]);
      const fParaMesAnio = parseFechaDDMM(fechaEsc);
      const mesGuardado = parseInt(r[12])||0, anioGuardado = parseInt(r[13])||0;
      const mes = fParaMesAnio ? fParaMesAnio.getMonth()+1 : mesGuardado;
      const anio = fParaMesAnio ? fParaMesAnio.getFullYear() : anioGuardado;
      // Reservas se cuentan por la fecha en que se tomó la reserva (fechaReserva), no por la
      // fecha de cobro — mismo criterio que mesAnioReservaOp() en index.html.
      const fReserva = parseFechaDDMM(fechaReserva);
      const mesReserva = fReserva ? fReserva.getMonth()+1 : mes;
      const anioReserva = fReserva ? fReserva.getFullYear() : anio;
      return { agente, estado: r[11], mes, anio, mesReserva, anioReserva };
    }).filter(o=>o.agente===sesionActiva);
  }
}

// ── Semana: igual lógica que getSemanasMes/getSemanas de index.html ──
function getSemanasMes(anio, mes){
  const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const semanas = [];
  const primerDia = new Date(anio, mes-1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  let dia = new Date(primerDia);
  function pushSemana(inicio, fin){
    semanas.push({
      lunes: inicio.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}),
      viernes: fin.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}),
      lunesLabel: DIAS[inicio.getDay()], viernesLabel: DIAS[fin.getDay()]
    });
  }
  const diaSemanaInicio = dia.getDay();
  if(diaSemanaInicio>=2 && diaSemanaInicio<=5){
    const inicioParcial = new Date(dia);
    const finParcial = new Date(dia);
    while(finParcial.getDay()!==5 && finParcial < ultimoDia) finParcial.setDate(finParcial.getDate()+1);
    const finReal = finParcial <= ultimoDia ? finParcial : ultimoDia;
    pushSemana(inicioParcial, finReal);
    dia = new Date(finReal); dia.setDate(dia.getDate()+1);
  }
  while(dia.getDay()!==1 && dia<=ultimoDia) dia.setDate(dia.getDate()+1);
  while(dia <= ultimoDia){
    const lunes = new Date(dia);
    const viernes = new Date(dia); viernes.setDate(dia.getDate()+4);
    pushSemana(lunes, viernes<=ultimoDia?viernes:ultimoDia);
    dia.setDate(dia.getDate()+7);
  }
  return semanas;
}

function kpiTileHTML(label, val, objetivo, color){
  const pct = objetivo>0 ? Math.min(100, Math.round(val/objetivo*100)) : 0;
  return `<div class="kpi-tile">
    <div class="kt-l">${label}</div><div class="kt-v" style="color:${color}">${val}</div>
    <div class="kpi-bar-wrap"><div class="kpi-bar" style="width:${pct}%;background:${color}"></div></div>
    <div class="kpi-obj">${val}/${objetivo} · ${pct}%</div>
  </div>`;
}

function renderKpisYMotivacion(){
  const obj = OBJ_BASE[sesionActiva] || OBJ_BASE['Kito'];
  const anio = new Date().getFullYear();
  const mesActual = new Date().getMonth()+1;
  const hoy = new Date();
  const diaHoy = hoy.getDate();
  const diasDelMes = new Date(anio, mesActual, 0).getDate();
  const fraccionMes = diaHoy/diasDelMes;

  // Suma de lo cargado este mes (todas las semanas que caen en el mes actual)
  const semanasMes = segData[mesActual]?.semanas || [];
  const totales = {};
  SEM_METRICAS.forEach(({key})=>{ totales[key] = semanasMes.reduce((s,sem)=>s+(sem.vals?.[key]||0),0); });

  const metricasKpi = [
    {label:'Prospección', key:'p', color:'var(--blue)'},
    {label:'Entrevistas', key:'ec', color:'var(--amber)'},
    {label:'ACM', key:'acm', color:'var(--lila,#A596C4)'},
    {label:'Muestras', key:'m', color:'var(--green)'},
  ];
  const tiles = metricasKpi.map(({label,key,color})=>{
    return {label, key, color, val: totales[key]||0, objMensual: obj[key]||0};
  });

  // Reservas y ventas del mes, calculadas solo con la info de Operaciones (no con carga manual):
  // reserva = toda operación propia cuya fecha de reserva cae en el mes, venta = las que ya
  // están en estado "Cobrada" (contadas por su fecha de cobro) — mismo criterio que index.html.
  const reservasMes = operacionesPropias.filter(o=>o.mesReserva===mesActual && o.anioReserva===anio).length;
  const ventasMes = operacionesPropias.filter(o=>o.mes===mesActual && o.anio===anio && o.estado==='Cobrada').length;
  const tilesOps = [
    {label:'Reservas (mes)', val: reservasMes, color:'var(--lila,#A596C4)'},
    {label:'Ventas (mes)', val: ventasMes, color:'var(--green)'}
  ];

  document.getElementById('kpi-wrap').innerHTML = tiles.map(t=>kpiTileHTML(t.label, t.val, t.objMensual||1, t.color)).join('')
    + tilesOps.map(t=>`<div class="kpi-tile"><div class="kt-l">${t.label}</div><div class="kt-v" style="color:${t.color}">${t.val}</div><div class="kpi-obj" style="color:var(--text3)">Desde Operaciones</div></div>`).join('');

  // % de cumplimiento general del mes a esta altura, vs. lo esperable según el día del mes
  const pcts = tiles.filter(t=>t.objMensual>0).map(t=>Math.min(150, t.val/t.objMensual*100));
  const pctGeneral = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;
  const pctEsperado = Math.round(fraccionMes*100);

  const frasesBuenas = ['🔥 Vas arriba del objetivo, seguí así.', '💪 Excelente ritmo este mes, no aflojes.', '🚀 Estás en racha, el mes va perfecto.'];
  const frasesMedias = ['👍 Vas en línea con el objetivo, a sostener el ritmo.', '📈 Bien encaminado, un empujón más y lo superás.'];
  const frasesBajas = ['⚡ Vas atrasado respecto del objetivo del mes — es momento de acelerar.', '🎯 Todavía estás lejos de la cuota del mes, hay que sumar actividad ya.', '⏰ El mes se escapa y los números están abajo — a moverse.'];

  let cls = 'pep-mid', frases = frasesMedias;
  if(pctGeneral >= pctEsperado + 10){ cls='pep-good'; frases=frasesBuenas; }
  else if(pctGeneral <= pctEsperado - 15){ cls='pep-low'; frases=frasesBajas; }
  const frase = frases[Math.floor(Math.random()*frases.length)];
  document.getElementById('pep-banner').innerHTML = `<div class="pep-banner ${cls}">${frase}</div>`;
}

function renderSemana(){

  // Objetivo semanal: mismo criterio que la tabla de Martina (mensual/4, con ACM y Promo fijos en 2 por semana)
  const objSemana = {
    p: Math.ceil((obj.p||0)/4), ec: Math.ceil((obj.ec||2)/4)||2, acm: 2, pr: 2,
    cg: Math.ceil((obj.cg||0)/4), m: Math.ceil((obj.m||0)/4)

  document.getElementById('semanas-wrap').innerHTML = semanas.map((sem,i)=>{

          <div class="metric-tile">
            <label>${label} <span style="color:var(--text3)">(obj ${o})</span></label>
            <input type="number" value="${v??''}" placeholder="0" style="${v!==undefined&&v!==null&&v!==''?('color:'+(cumple?'var(--green)':'var(--red)')):''}"
              onchange="guardarMetricaSemana(${mes},${i},'${key}',this.value)">

          <div class="accion-item ${a.cumplida?'done':''}">

            <span>${a.texto}</span>
          </div>`).join('') || '<div style="font-size:11px;color:var(--text3)">Sin acciones cargadas</div>'}
        <div class="accion-add">

  }).join('');
}

function guardarMetricaSemana(mes, semIdx, key, val){
  if(!segData[mes]) segData[mes]={semanas:[]};
  while(segData[mes].semanas.length<=semIdx) segData[mes].semanas.push({fecha:'',vals:{}});
  segData[mes].semanas[semIdx].vals[key] = parseFloat(val)||0;
  dbGuardar('seguimiento_semanal', [Date.now(), sesionActiva, mes, semIdx, key, parseFloat(val)||0]);
  if(mes === new Date().getMonth()+1) renderKpisYMotivacion();
  showToast('Guardado');
}
function agregarAccion(mes, semIdx){
  const input = document.getElementById(`nueva-accion-${mes}-${semIdx}`);
  const texto = (input?.value||'').trim();
  if(!texto) return;
  const accionId = 'a'+Date.now();
  if(!segAcciones[mes]) segAcciones[mes]={};
  if(!segAcciones[mes][semIdx]) segAcciones[mes][semIdx]={};
  segAcciones[mes][semIdx][accionId] = {texto, cumplida:false};
  dbGuardar('seguimiento_acciones', [Date.now(), sesionActiva, mes, semIdx, accionId, texto, false]);
  renderSemana();
}
function toggleAccion(mes, semIdx, accionId, cumplida){
  const a = segAcciones?.[mes]?.[semIdx]?.[accionId];
  if(!a) return;
  a.cumplida = cumplida;
  dbGuardar('seguimiento_acciones', [Date.now(), sesionActiva, mes, semIdx, accionId, a.texto, cumplida]);
  showToast('Guardado');
}

// Edición "tocar el texto": cualquier dato de texto de una tarjeta (captación o búsqueda)
// se puede tocar para convertirlo en un input editable (se puede modificar o borrar el
// contenido); el cambio se guarda recién al tocar OK, nunca solo. Esto reemplaza al botón
// único de "Editar" por campo: cada campo se edita por separado, tocándolo directamente.
let campoEditKey = null; // `${entidad}:${id}:${campo}`
let campoDraftVal = '';

function valorCampo(entidad, id, campo){
  if(entidad==='muestra'){
    const partes = id.split('_'); const idx = parseInt(partes.pop()); const busId = partes.join('_');
    const b = busquedas.find(x=>x.id===busId); const m = b && (b.muestras||[])[idx];
    return m && m[campo]!=null ? String(m[campo]) : '';
  }
  const obj = entidad==='busqueda' ? busquedas.find(x=>x.id===id) : captaciones.find(x=>x.id===id);
  return obj && obj[campo]!=null ? String(obj[campo]) : '';
}
function iniciarEdicionCampo(entidad, id, campo){
  campoEditKey = entidad+':'+id+':'+campo;
  campoDraftVal = valorCampo(entidad, id, campo);
  if(campo==='fecha' || campo==='fechaReserva') campoDraftVal = fechaAFechaInput(campoDraftVal);
  if(entidad==='busqueda' || entidad==='muestra') renderBusquedas(); else renderCaptaciones();
}
function draftCampo(val){ campoDraftVal = val; }
function confirmarCampo(){
  if(!campoEditKey) return;
  const [entidad, id, campo] = campoEditKey.split(':');
  let val = campoDraftVal;
  if(campo==='fecha' || campo==='fechaReserva') val = fechaInputAFecha(val);
  else if(campo==='precioUSD') val = parseFloat(val)||0;
  else if(campo==='dormitorios') val = parseInt(val)||0;
  if(entidad==='muestra'){
    const partes = id.split('_'); const idx = parseInt(partes.pop()); const busId = partes.join('_');
    const b = busquedas.find(x=>x.id===busId); if(!b || !b.muestras[idx]) return;
    b.muestras[idx][campo] = val;
    dbGuardar('busquedas', filaBusqueda(b));
    campoEditKey = null;
    renderBusquedas();
  } else if(entidad==='busqueda'){
    const b = busquedas.find(x=>x.id===id); if(!b) return;
    b[campo] = val;
    dbGuardar('busquedas', filaBusqueda(b));
    campoEditKey = null;
    renderBusquedas();
  } else {
    const cap = captaciones.find(x=>x.id===id); if(!cap) return;
    cap[campo] = val;
    dbGuardar('captaciones', filaCaptacion(cap));
    campoEditKey = null;
    renderCaptaciones();
  }
  showToast('Guardado');
}
function cancelarCampo(){
  if(!campoEditKey) return;
  const entidad = campoEditKey.split(':')[0];
  campoEditKey = null;
  if(entidad==='busqueda' || entidad==='muestra') renderBusquedas(); else renderCaptaciones();
}
function campoHTML(entidad, id, campo, opts){
  opts = opts||{};
  const key = entidad+':'+id+':'+campo;
  if(campoEditKey===key){
    const tag = opts.textarea
      ? `<textarea class="inp" style="width:100%;min-height:50px" autofocus oninput="draftCampo(this.value)">${campoDraftVal}</textarea>`
      : `<input class="inp" type="${opts.tipo||'text'}" value="${campoDraftVal}" autofocus oninput="draftCampo(this.value)" style="${opts.style||''}">`;
    return `<div style="margin-top:4px">${tag}<div style="display:flex;gap:6px;margin-top:4px"><span class="chip" style="color:var(--green)" onclick="confirmarCampo()">OK</span><span class="chip" onclick="cancelarCampo()">Cancelar</span></div></div>`;
  }
  const texto = opts.formatear ? opts.formatear(valorCampo(entidad,id,campo)) : (valorCampo(entidad,id,campo) || opts.vacio || '—');
  return `<span onclick="iniciarEdicionCampo('${entidad}','${id}','${campo}')" style="cursor:pointer;border-bottom:1px dashed var(--border);${opts.estilo||''}">${texto}</span>`;
}

      </div>
      <div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">
        ${FC_ETAPAS.map(([k,l])=>`<span class="chip ${cap[k]?'on':''}" onclick="toggleEtapaCaptacion('${cap.id}','${k}')">${l}</span>`).join('')}
      </div>
      ${cap.publicacion ? `
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <span class="chip" style="color:var(--green)" onclick="cerrarCaptacion('${cap.id}','vendida_propia')">Vendido por mí</span>
        <span class="chip" style="color:var(--blue)" onclick="cerrarCaptacion('${cap.id}','vendida_otro')">Vendido por otro</span>
        <span class="chip" style="color:var(--amber)" onclick="cerrarCaptacion('${cap.id}','baja')">Baja</span>
      </div>` : `
      <div style="margin-top:10px"><span class="chip" style="color:var(--red)" onclick="descartarCaptacion('${cap.id}')">Descartar</span></div>`}
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:12px">Sin captaciones activas todavía.</div>';

  const cerradasHTML = cerradas.length ? `
    <div style="font-size:11px;font-weight:700;color:var(--text3);margin:16px 0 8px;text-transform:uppercase">Historial</div>
    <div class="cards-grid">${cerradas.map(cap=>`
      <div class="capt-card" style="opacity:.85">
        <div style="display:flex;justify-content:space-between">
          <div style="font-weight:700;font-size:13px">${cap.direccion}</div>
          <div style="color:var(--text3);font-size:11px">${CAPT_RESULTADO_LABEL[cap.estado]||cap.estado}</div>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:4px">${cap.fechaCierre?'Cierre: '+cap.fechaCierre:''}${cap.motivoCierre?' · '+cap.motivoCierre:''}</div>
        <div style="margin-top:8px"><span class="chip" onclick="reactivarCaptacion('${cap.id}')">↺ Reactivar</span></div>
      </div>`).join('')}</div>` : '';

  document.getElementById('capt-wrap').innerHTML = `<div class="cards-grid">${activasHTML}</div>${cerradasHTML}`;
}

// ── Búsquedas propias ──
function crearBusquedaAsesor(){
  const nombreCliente = (document.getElementById('nb-cliente').value||'').trim();
  const detalle = (document.getElementById('nb-detalle').value||'').trim();
  if(!nombreCliente){ showToast('Falta el nombre del cliente'); return; }
  const c = resolverClientePorNombre(nombreCliente);
  const b = {id:'b'+Date.now(), clienteId:c.id, agente:sesionActiva, tipoPunta:'Búsqueda',
    propiedadRelacionada:'', criterios: detalle,
    tipo: document.getElementById('nb-tipo').value||'', zona: document.getElementById('nb-zona').value||'',
    precioUSD: parseFloat(document.getElementById('nb-precio').value)||0, dormitorios: parseInt(document.getElementById('nb-dorm').value)||0,
    muestras:[], estado:'en_proceso', fechaReserva:'', fechaEscritura:'', fechaDescarte:'', motivoDescarte:''};
  busquedas.push(b);
  dbGuardar('busquedas', filaBusqueda(b));
  ['nb-cliente','nb-tipo','nb-zona','nb-precio','nb-dorm','nb-detalle'].forEach(id=>document.getElementById(id).value='');
  renderBusquedas();
  showToast('Búsqueda agregada');
}
function marcarReserva(busId){
  const b = busquedas.find(x=>x.id===busId); if(!b) return;
  b.estado='reservada'; b.fechaReserva=fechaHoyDDMM();
  dbGuardar('busquedas', filaBusqueda(b));
  renderBusquedas();
}
function descartarBusqueda(busId){
  const b = busquedas.find(x=>x.id===busId); if(!b) return;
  const motivo = prompt('Motivo del descarte:') || '';
  b.estado='descartada'; b.fechaDescarte=fechaHoyDDMM(); b.motivoDescarte=motivo;
  dbGuardar('busquedas', filaBusqueda(b));
  renderBusquedas();
}
function nombreClientePorId(clienteId){
  const c = clientes.find(x=>x.id===clienteId);
  return c ? c.nombre : 'Cliente s/d';
}
function fechaInputHoy(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fechaInputAFecha(iso){
  if(!iso) return fechaHoyDDMM();
  const [y,m,d] = iso.split('-');
  return d+'/'+m;
}

let busquedaMuestraAbierta = null;

function abrirMuestraForm(busId){
  busquedaMuestraAbierta = busId;
  renderBusquedas();
}
function confirmarMuestra(busId){
  const b = busquedas.find(x=>x.id===busId); if(!b) return;
  const fechaIso = document.getElementById('mu-fecha-'+busId).value || fechaInputHoy();
  const propiedad = (document.getElementById('mu-prop-'+busId).value||'').trim();
  b.muestras = (b.muestras||[]).concat([{fecha:fechaInputAFecha(fechaIso), propiedad}]);
  dbGuardar('busquedas', filaBusqueda(b));
  busquedaMuestraAbierta = null;
  renderBusquedas();
  showToast('Muestra agregada');
}
function cancelarMuestra(){
  busquedaMuestraAbierta = null;
  renderBusquedas();
}
function fechaAFechaInput(ddmm){
  if(!ddmm || !ddmm.includes('/')) return fechaInputHoy();
  const [d,m] = ddmm.split('/');
  return new Date().getFullYear()+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
}
function eliminarMuestra(busId, idx){
  const b = busquedas.find(x=>x.id===busId); if(!b) return;
  b.muestras.splice(idx,1);
  dbGuardar('busquedas', filaBusqueda(b));
  renderBusquedas();
}
function revertirBusqueda(busId){
  const b = busquedas.find(x=>x.id===busId); if(!b) return;
  b.estado = 'en_proceso'; b.fechaReserva=''; b.fechaDescarte=''; b.motivoDescarte='';
  dbGuardar('busquedas', filaBusqueda(b));
  renderBusquedas();
  showToast('Vuelve a "en proceso"');
}

function renderBusquedas(){
  const estadoLbl = {en_proceso:'en proceso', reservada:'reservada', escriturada:'escriturada', descartada:'descartada'};
  document.getElementById('busq-wrap').innerHTML = '<div class="cards-grid">' + (busquedas.map(b=>{
    const muestraFormHTML = busquedaMuestraAbierta===b.id ? `
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <input class="inp" type="date" id="mu-fecha-${b.id}" value="${fechaInputHoy()}" style="flex:0 0 140px">
        <input class="inp" id="mu-prop-${b.id}" placeholder="Propiedad mostrada" style="flex:1 1 140px">
        <span class="chip" style="color:var(--green)" onclick="confirmarMuestra('${b.id}')">OK</span>
        <span class="chip" onclick="cancelarMuestra()">Cancelar</span>
      </div>` : '';

    return `
    <div class="consulta-card">
      <div style="font-weight:800;font-size:15px;color:var(--gold2)">${nombreClientePorId(b.clienteId)}</div>
      <div style="font-size:10.5px;color:var(--text3);margin-top:2px">
        ${campoHTML('busqueda',b.id,'tipo',{vacio:'tipo s/d'})} · ${campoHTML('busqueda',b.id,'zona',{vacio:'zona s/d'})} · USD ${campoHTML('busqueda',b.id,'precioUSD',{tipo:'number',formatear:v=>(parseFloat(v)||0).toLocaleString('es-AR')})}${campoHTML('busqueda',b.id,'dormitorios',{tipo:'number',formatear:v=>v?' · '+v+' dorm.':'',vacio:''})}
      </div>
      <div style="font-size:10px;color:var(--text3);opacity:.8;margin-top:4px">${campoHTML('busqueda',b.id,'criterios',{textarea:true,vacio:'Sin detalle (tocar para agregar)'})}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <span style="font-size:10px;color:var(--text3)">Muestras</span>
        <span style="font-weight:800">${(b.muestras||[]).length}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--text3)">${estadoLbl[b.estado]||b.estado}</span>
      </div>
      ${(b.muestras||[]).length ? `<div style="margin-top:4px">${(b.muestras||[]).map((m,idx)=>{
        const key = b.id+'_'+idx;
        return `<div style="font-size:9.5px;color:var(--text3);display:flex;gap:6px;align-items:center;margin-top:2px">
          ${campoHTML('muestra',key,'fecha',{tipo:'date',style:'flex:0 0 130px'})} · ${campoHTML('muestra',key,'propiedad',{vacio:'propiedad s/d'})}
          <span class="chip" style="padding:1px 6px;font-size:9px;color:var(--red)" onclick="eliminarMuestra('${b.id}',${idx})">✕</span>
        </div>`;
      }).join('')}</div>` : ''}
      ${muestraFormHTML}
      ${b.estado==='reservada' ? `
      <div style="font-size:10px;color:var(--text3);margin-top:6px">Fecha de reserva: ${campoHTML('busqueda',b.id,'fechaReserva',{tipo:'date',vacio:'tocar para poner fecha'})}</div>` : ''}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${b.estado==='en_proceso' ? `
        <span class="chip" style="color:var(--green)" onclick="abrirMuestraForm('${b.id}')">+ Muestra</span>
        <span class="chip" onclick="marcarReserva('${b.id}')">Reserva</span>
        <span class="chip" style="color:var(--red)" onclick="descartarBusqueda('${b.id}')">Descartar</span>` : `
        <span class="chip" style="color:var(--green)" onclick="abrirMuestraForm('${b.id}')">+ Muestra</span>
        <span class="chip" onclick="revertirBusqueda('${b.id}')">Volver a "en proceso"</span>`}
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:12px">Sin búsquedas cargadas todavía.</div>') + '</div>';
}

// Decoración bokeh (mismas burbujas difuminadas que el fondo de SOLUMITOS)
(function(){
  const b = document.getElementById('bokeh');
  const cols = ['rgba(227,201,138,.55)','rgba(45,212,196,.30)','rgba(95,127,166,.40)','rgba(227,160,100,.40)','rgba(120,150,170,.30)'];
  let seed = 7; const r = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  for(let i=0;i<26;i++){
    const s = 40+r()*140, d = document.createElement('i');
    d.style.cssText = `width:${s}px;height:${s}px;left:${r()*100}%;top:${r()*100}%;background:${cols[Math.floor(r()*cols.length)]};`;
    b.appendChild(d);
  }
  // Cubo de Metatrón (13 círculos de la Flor de la Vida + todas sus conexiones), distribuido
  // disimulado entre las otras figuras del fondo, muy tenue, como otro elemento geométrico más.
  const metatronSVG = () => {
    const R1 = 22, R2 = 22*Math.sqrt(3), pts = [[0,0]];
    for(let a=0;a<360;a+=60) pts.push([R1*Math.cos(a*Math.PI/180), R1*Math.sin(a*Math.PI/180)]);
    for(let a=30;a<360;a+=60) pts.push([R2*Math.cos(a*Math.PI/180), R2*Math.sin(a*Math.PI/180)]);
    let lines = '', circles = '';
    for(let i=0;i<pts.length;i++){
      circles += `<circle cx="${pts[i][0].toFixed(2)}" cy="${pts[i][1].toFixed(2)}" r="1.6"/>`;
      for(let j=i+1;j<pts.length;j++) lines += `<line x1="${pts[i][0].toFixed(2)}" y1="${pts[i][1].toFixed(2)}" x2="${pts[j][0].toFixed(2)}" y2="${pts[j][1].toFixed(2)}"/>`;
    }
    return `<svg viewBox="-50 -50 100 100" stroke="rgba(227,201,138,.16)" stroke-width="0.4" fill="rgba(227,201,138,.14)">${lines}${circles}</svg>`;
  };
  for(let i=0;i<3;i++){
    const s = 220+r()*160, rot = r()*360, m = document.createElement('div');
    m.className = 'metatron';
    m.style.cssText = `width:${s}px;height:${s}px;left:${r()*100}%;top:${r()*100}%;transform:translate(-50%,-50%) rotate(${rot}deg);opacity:${0.4+r()*0.3};`;
    m.innerHTML = metatronSVG();
    b.appendChild(m);
  }
})();

// Sesión persistida en esta pestaña (no entre dispositivos, por simplicidad)
(function(){
  const prev = sessionStorage.getItem('asesorSesion');
  if(prev && ASESORES.some(a=>a.value===prev)){
    sesionActiva = prev;
    entrarApp();
  }
})();

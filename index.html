<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Solumitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#14161f; --card:#1e2130; --card-2:#262a3d; --text:#f2f2fa; --muted:#8b8fa8; --line:#2d3146;
    --lila:#9b7ede; --magenta:#e0447e; --azul:#3aa0e8; --verde:#2fd6b8; --naranja:#ffa53e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; padding-bottom:74px; }
  header { padding:16px 18px 8px; display:flex; justify-content:space-between; align-items:center; }
  .who { display:flex; align-items:center; gap:10px; }
  .avatar-bot { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, var(--azul), var(--magenta)); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .who-text .hi { font-size:11px; color:var(--muted); }
  .who-text .name { font-size:14.5px; font-weight:800; }
  .motivacional { font-size:10.5px; color:var(--naranja); font-weight:700; margin-top:2px; max-width:200px; line-height:1.3; }
  .titulo { font-size:15px; font-weight:800; }
  .header-btns { display:flex; gap:6px; }
  .header-btn { font-size:10px; font-weight:700; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:20px; padding:6px 9px; cursor:pointer; white-space:nowrap; }
  main { padding:0 18px; }
  .view { display:none; }
  .view.active { display:block; }
  .loading { color:var(--muted); font-size:12.5px; text-align:center; padding:14px 0; }

  /* AGENDA */
  .cal-header { display:flex; align-items:center; justify-content:space-between; padding:6px 0 10px; }
  .cal-day { font-size:12.5px; color:var(--muted); }
  .cal-num { font-size:24px; font-weight:800; }
  .cal-nav { display:flex; gap:14px; color:var(--muted); font-size:18px; }
  .cal-nav span { padding:4px 8px; border-radius:8px; transition:background .1s, transform .1s; cursor:pointer; }
  .cal-nav span:active, .cal-nav span.pulsando { background:var(--card); transform:scale(0.85); color:var(--verde); }
  .cal-mes { font-size:12.5px; color:var(--muted); font-weight:700; }
  .modo-cal-toggle { display:flex; background:var(--card); border-radius:14px; padding:4px; margin-bottom:12px; }
  .modo-cal-btn { flex:1; text-align:center; padding:8px 0; font-size:12px; font-weight:700; color:var(--muted); border-radius:10px; cursor:pointer; }
  .modo-cal-btn.active { background:var(--verde); color:#062b23; }
  .cal-vista { display:none; }
  .cal-vista.active { display:block; }
  .semana-scroll { overflow-x:auto; border-top:1px solid var(--line); }
  .semana-inner { display:flex; min-width:620px; position:relative; }
  .semana-hourcol { width:38px; flex-shrink:0; }
  .semana-hourcell { height:38px; font-size:9px; color:var(--muted); border-bottom:1px solid var(--line); padding-top:2px; }
  .semana-daycol { flex:1; min-width:82px; border-left:1px solid var(--line); position:relative; }
  .semana-dayhead { text-align:center; font-size:10px; color:var(--muted); font-weight:700; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .semana-dayhead.hoy { color:var(--verde); }
  .semana-daybody { position:relative; }
  .semana-hourline { height:38px; border-bottom:1px solid var(--line); }
  .semana-event { position:absolute; left:2px; right:2px; border-radius:5px; font-size:8.5px; font-weight:700; padding:2px 4px; overflow:hidden; cursor:pointer; box-shadow:0 0 0 1px var(--bg); }
  .mes-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px; }
  .mes-dow { text-align:center; font-size:9.5px; color:var(--muted); font-weight:700; padding-bottom:6px; }
  .mes-cell { aspect-ratio:1; border-radius:10px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:5px 0; font-size:11px; font-weight:700; cursor:pointer; }
  .mes-cell.hoy { border:1.5px solid var(--verde); color:var(--verde); }
  .mes-dots { display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  .mes-dot { width:5px; height:5px; border-radius:50%; }
  .cal-grid { position:relative; border-top:1px solid var(--line); }
  .cal-hour-row { height:80px; display:flex; border-bottom:1px solid var(--line); }
  .cal-hour-lbl { width:42px; font-size:10px; color:var(--muted); padding-top:4px; flex-shrink:0; }
  .cal-hour-line { flex:1; cursor:pointer; }
  .cal-events-layer { position:absolute; top:0; left:46px; right:0; bottom:0; }
  .cal-event { position:absolute; left:2px; right:2px; border-radius:6px; padding:4px 8px; font-size:11px; font-weight:700; overflow:hidden; cursor:pointer; box-shadow:0 0 0 2px var(--bg); line-height:1.25; }
  .cal-event .sub { font-size:9px; font-weight:500; opacity:.85; margin-top:1px; }
  .cal-event.compacto { padding:2px 8px; font-size:10px; white-space:nowrap; text-overflow:ellipsis; }
  .cal-event.compacto .sub { display:none; }
  .ev-lila{background:var(--lila);color:#1c0f33} .ev-magenta{background:var(--magenta);color:#2c0518}
  .ev-azul{background:var(--azul);color:#041a2c} .ev-verde{background:var(--verde);color:#06281c} .ev-naranja{background:var(--naranja);color:#2c1600}
  .completada { }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(10,11,25,.75); display:none; align-items:flex-end; z-index:70; }
  .modal-overlay.active { display:flex; }
  .modal-box { background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:20px 18px 26px; max-height:85vh; overflow-y:auto; }
  .modal-title { font-size:15px; font-weight:800; margin-bottom:4px; }
  .modal-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .opcion-btn { width:100%; text-align:left; background:var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:13px 14px; margin-bottom:9px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .opcion-btn.manual { border-style:dashed; color:var(--muted); }
  .opcion-btn .flecha { float:right; color:var(--muted); }
  .modal-cancelar { width:100%; text-align:center; padding:12px; color:var(--muted); font-size:13px; margin-top:4px; cursor:pointer; }
  textarea.pega, input.q, .modal-box input[type=datetime-local] { width:100%; background:var(--card-2); border:1px solid var(--line); border-radius:12px; color:var(--text); padding:11px 12px; font-size:13px; font-family:'Manrope',sans-serif; margin-bottom:12px; }
  label.q { display:block; font-size:11px; color:var(--muted); font-weight:700; margin:10px 0 5px; }
  .link-chip { display:flex; align-items:center; gap:8px; background:var(--card-2); border-radius:10px; padding:9px 10px; margin-bottom:8px; font-size:12px; }
  .link-chip .url { flex:1; word-break:break-all; color:var(--verde); }
  .hist-item { font-size:11.5px; color:var(--muted); padding:7px 0; border-bottom:1px solid var(--line); }
  .hist-item:last-child { border-bottom:none; }
  .hist-item b { color:var(--text); }
  .btn-detectar,.btn-continuar { width:100%; border:none; border-radius:12px; padding:12px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .btn-detectar { background:var(--card-2); color:var(--text); border:1px solid var(--line); }
  .btn-continuar { background:var(--verde); color:#062b23; font-weight:800; }

  /* CLIENTES */
  .top-toggle { display:flex; background:var(--card); border-radius:14px; padding:4px; margin:14px 0 12px; }
  .top-toggle-btn { flex:1; text-align:center; padding:10px 0; font-size:13px; font-weight:700; color:var(--muted); border-radius:10px; cursor:pointer; }
  .top-toggle-btn.active { background:var(--verde); color:#062b23; }
  .funnel-label { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:16px 2px 8px; }
  .grupo { border-radius:14px; margin-bottom:8px; overflow:hidden; }
  .grupo-head { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; cursor:pointer; font-weight:800; font-size:13.5px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .grupo-head .chev { transition:transform .15s; }
  .grupo.abierto .grupo-head .chev { transform:rotate(180deg); }
  .grupo-body { display:none; background:var(--card); padding:4px 10px 8px; }
  .grupo.abierto .grupo-body { display:block; }
  .cliente-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .cliente-row:last-child { border-bottom:none; }
  .cliente-nombre { font-size:13.5px; font-weight:700; }
  .cliente-tarea { font-size:11px; color:var(--muted); margin-top:1px; }
  .cliente-actions { display:flex; gap:6px; flex-shrink:0; }
  .icon-btn { width:30px; height:30px; border-radius:50%; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; border:none; }
  .buscador-row { display:flex; gap:8px; margin-bottom:10px; }
  input.buscador { flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; color:var(--text); padding:12px 13px; font-size:13.5px; font-family:'Manrope',sans-serif; }
  .tags-filtro { display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; }
  .tag-filtro { font-size:11px; padding:7px 12px; border-radius:20px; background:var(--card); color:var(--muted); white-space:nowrap; cursor:pointer; border:1px solid var(--line); }
  .tag-filtro.active { background:var(--verde); color:#062b23; font-weight:700; }
  .potencial-card { background:var(--card); border-radius:16px; padding:13px 14px; margin-bottom:9px; cursor:pointer; }
  .ptag { font-size:9.5px; font-weight:800; padding:4px 9px; border-radius:8px; background:var(--card-2); color:var(--muted); margin-right:5px; }
  .btn-chico { font-size:10.5px; font-weight:800; padding:7px 11px; border-radius:10px; border:none; cursor:pointer; margin-right:6px; }

  /* CARGA */
  .chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 160px); padding-top:10px; }
  .chat-msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:10px; }
  .msg { max-width:80%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.4; }
  .msg-bot { background:var(--card); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-user { background:var(--verde); color:#062b23; align-self:flex-end; border-bottom-right-radius:4px; font-weight:600; }
  .quick-replies { display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:90%; }
  .quick-reply { background:var(--card-2); border:1px solid var(--line); color:var(--text); border-radius:20px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .chat-input-row { display:flex; gap:8px; align-items:center; padding:10px 0 4px; border-top:1px solid var(--line); }
  .chat-text-input { flex:1; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:11px 15px; color:var(--text); font-size:13.5px; font-family:'Manrope',sans-serif; }
  .chat-send { width:40px; height:40px; border-radius:50%; background:var(--verde); border:none; color:#062b23; font-size:16px; cursor:pointer; }
  .chat-attach { width:40px; height:40px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; position:relative; flex-shrink:0; }
  .chat-attach input { position:absolute; inset:0; opacity:0; cursor:pointer; }

  /* METAS */
  .card { background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; margin-top:14px; }
  .card-title { font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:10px; }
  .bar-row .lbl-row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .bar-track { height:8px; background:var(--card-2); border-radius:6px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:6px; }

  .bottom-nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); z-index:10; padding:7px 0 5px; }
  .nav-item { flex:1; text-align:center; font-size:10px; color:var(--muted); font-weight:700; padding:6px 0; cursor:pointer; }
  .nav-item.active { color:var(--verde); }
  .nav-icon { font-size:18px; display:block; margin-bottom:3px; }

  .banner-error { background:#3a1f22; color:#ff9b9b; font-size:12px; padding:10px 14px; border-radius:12px; margin:10px 0; display:none; }

  /* CAPTACIONES */
  .agent-card { border-radius:16px; padding:14px; margin-bottom:12px; border:2px solid var(--line); background:var(--card); }
  .agent-card.ritmo-ok { border-color:var(--verde); }
  .agent-card.ritmo-mal { border-color:var(--magenta); }
  .agent-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .agent-card-header .name { font-weight:800; font-size:14px; }
  .ritmo-tag { font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:8px; margin-left:8px; }
  .ritmo-tag.ok { background:var(--verde); color:#062b23; }
  .ritmo-tag.mal { background:var(--magenta); color:#2c0518; }
  .effectiveness-badge { font-size:10.5px; font-weight:700; color:var(--muted); }
  .cap-toggle { font-size:11.5px; color:var(--verde); font-weight:700; cursor:pointer; margin-top:4px; }
  .mes-filtro-wrap { background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .mes-filtro-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mes-chip { font-size:10.5px; padding:5px 9px; border-radius:8px; background:var(--card-2); color:var(--muted); cursor:pointer; }
  .mes-chip.active { background:var(--verde); color:#062b23; }
  .prospeccion-card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:10px; }
  .prospeccion-card .nombre { font-weight:800; font-size:13.5px; }
  .prospeccion-card .idea { font-size:11.5px; color:var(--naranja); margin:6px 0; font-style:italic; }
  .prospeccion-card .pregunta { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .checkin-banner { background:var(--naranja); color:#2c1600; border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:12.5px; font-weight:700; }
  .usuario-selector { display:flex; gap:6px; padding:0 18px 10px; position:sticky; top:0; z-index:5; background:var(--bg); }
  .usuario-btn { flex:1; text-align:center; padding:8px 0; font-size:12px; font-weight:700; border-radius:10px; background:var(--card); color:var(--muted); cursor:pointer; border:1.5px solid transparent; }
  .usuario-btn.active { background:var(--verde); color:#062b23; border-color:var(--verde); }

  /* Tarjeta de propiedad (Captación) — diseño ancho tipo mobile-card */
  .cap-item { background:linear-gradient(160deg, var(--card) 0%, #1a1d2b 100%); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px; margin-top:10px; width:100%; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  .cap-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .cap-titulos { min-width:0; }
  .cap-dir { font-size:16px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cap-sub { font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.4px; margin-top:3px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cap-sub .dot { color:var(--magenta); margin:0 5px; }
  .cap-sub .prop { color:var(--magenta); }
  .cap-precio-wrap { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .cap-precio { border:1.5px solid var(--verde); color:var(--verde); font-weight:800; font-size:12.5px; padding:6px 10px; border-radius:10px; background:rgba(47,214,184,.08); white-space:nowrap; }
  .cap-edit-btn { width:28px; height:28px; border-radius:9px; background:var(--card-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .cap-edit-btn svg { width:13px; height:13px; color:var(--muted); }
  .cap-pills { display:flex; flex-wrap:nowrap; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .cap-pills::-webkit-scrollbar { display:none; }
  .pill { font-size:9.5px; font-weight:800; letter-spacing:.2px; padding:6px 10px; border-radius:20px; border:1.5px solid var(--line); color:var(--muted); background:transparent; cursor:pointer; user-select:none; white-space:nowrap; flex-shrink:0; }
  .pill.on { color:#062b23; border-color:transparent; background:var(--verde); }
  .pill.baja { color:#ff4d5e; border-color:#ff4d5e; background:rgba(255,77,94,.08); }
  .pill.baja.on { background:#ff4d5e; color:#2c0006; }
  .cap-progreso-wrap { margin-top:13px; }
  .cap-progreso-track { height:7px; width:100%; background:var(--card-2); border-radius:6px; overflow:hidden; }
  .cap-progreso-fill { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--magenta), var(--verde)); }
  .cap-progreso-footer { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .cap-fecha { font-size:10px; color:var(--muted); font-weight:600; }
  .cap-fecha b { color:var(--text); font-weight:800; }
  .cap-progreso-pct { font-size:10px; color:var(--text); font-weight:800; }
  .cap-extra { font-size:10.5px; color:var(--muted); margin-top:8px; }
  .cap-extra-title { font-size:9px; color:var(--muted); font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-top:10px; cursor:pointer; }
  .btn-nopub { border:1px solid var(--magenta); color:var(--magenta); background:none; border-radius:8px; padding:5px 10px; font-size:10.5px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div class="who">
    <div class="avatar-bot">🤖</div>
    <div class="who-text">
      <div class="hi">Hola de nuevo</div>
      <div class="name">Martu</div>
      <div class="motivacional" id="frase-motivacional"></div>
    </div>
  </div>
  <div class="header-btns" id="header-btns"></div>
</header>
<div class="usuario-selector">
  <div class="usuario-btn" id="usuario-btn-Martu" onclick="cambiarUsuarioActivo('Martu')">Martu</div>
  <div class="usuario-btn" id="usuario-btn-Jose" onclick="cambiarUsuarioActivo('Jose')">José</div>
  <div class="usuario-btn" id="usuario-btn-Ambos" onclick="cambiarUsuarioActivo('Ambos')">Ambos</div>
</div>

<main>
  <div class="banner-error" id="banner-error"></div>
  <div class="checkin-banner" id="banner-sin-tarea" style="display:none;align-items:center;justify-content:space-between;cursor:pointer" onclick="abrirSinTarea()">
    <span class="txt"></span><span style="font-weight:800">Ver ›</span>
  </div>

  <!-- AGENDA -->
  <div id="view-agenda" class="view active">
    <div class="cal-header">
      <div><div class="cal-day" id="cal-day-lbl"></div><div class="cal-num" id="cal-num-lbl"></div></div>
      <div class="cal-mes" id="cal-mes-lbl"></div>
      <div class="cal-nav"><span onclick="navegar(-1, this)">‹</span><span onclick="navegar(1, this)">›</span></div>
    </div>
    <div class="modo-cal-toggle">
      <div class="modo-cal-btn active" data-modo="dia" onclick="cambiarModoCal('dia')">Día</div>
      <div class="modo-cal-btn" data-modo="semana" onclick="cambiarModoCal('semana')">Semana</div>
      <div class="modo-cal-btn" data-modo="mes" onclick="cambiarModoCal('mes')">Mes</div>
    </div>
    <div id="cal-vista-dia" class="cal-vista active"><div id="cal-grid" class="cal-grid"><div class="loading">Cargando agenda…</div></div></div>
    <div id="cal-vista-semana" class="cal-vista"><div class="semana-scroll"><div id="semana-inner" class="semana-inner"></div></div></div>
    <div id="cal-vista-mes" class="cal-vista"><div id="mes-grid" class="mes-grid"></div></div>
  </div>

  <!-- CLIENTES -->
  <div id="view-clientes" class="view">
    <div class="top-toggle">
      <div class="top-toggle-btn active" onclick="cambiarBloqueClientes('activos', event)">Activos</div>
      <div class="top-toggle-btn" onclick="cambiarBloqueClientes('potenciales', event)">Potenciales</div>
    </div>
    <div id="bloque-activos">
      <div class="buscador-row"><input class="buscador" placeholder="Buscar cliente o etapa..." oninput="cargarActivos(this.value)"></div>
      <div id="grupos-activos"><div class="loading">Cargando…</div></div>
    </div>
    <div id="bloque-potenciales" style="display:none">

<script>
// ================= CONEXIÓN CON LA API (Apps Script) =================
// Pegá acá la URL de tu Web App de Apps Script (Implementar → Nueva implementación → Aplicación web).
// Termina en /exec
const APP_URL = 'https://script.google.com/macros/s/AKfycbwAZeUnGl2i99wChU04g1W5a8s1Vwe330ZWY3WNDlKFtY_Yu_1CUbvlyad-mp3agcdQig/exec';

let _accionEnCurso = false;
function _bloqueadoAhora() { if (_accionEnCurso) return true; _accionEnCurso = true; setTimeout(() => { _accionEnCurso = false; }, 4000); return false; }

let _jsonpContador = 0;
function apiCall(action, params) {
  return new Promise(function(resolve, reject) {
    const cbNombre = '_crmCallback' + (_jsonpContador++);
    const url = new URL(APP_URL);
    url.searchParams.set('action', action);
    Object.keys(params || {}).forEach(function(k) {
      const v = params[k];
      if (v === null || v === undefined || v === '') return;
      url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v);
    });
    url.searchParams.set('callback', cbNombre);

    const script = document.createElement('script');
    let resuelto = false;
    const limpiar = function() { delete window[cbNombre]; script.remove(); clearTimeout(timeoutId); };
    const timeoutId = setTimeout(function() {
      if (resuelto) return;
      resuelto = true;
      limpiar();
      reject(new Error('La API no respondió en 20 segundos (acción: ' + action + '). Puede ser que Apps Script esté tardando mucho o que haya un error — revisá el log de Ejecuciones en el editor de Apps Script.'));
    }, 20000);

    window[cbNombre] = function(data) {
      if (resuelto) return;
      resuelto = true;
      limpiar();
      if (data && data.error) reject(new Error(data.error));
      else resolve(data);
    };
    script.onerror = function() {
      if (resuelto) return;
      resuelto = true;
      limpiar();
      reject(new Error('No se pudo conectar con la API.'));
    };
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

// ================= NAV =================
const cacheVistas = { agenda: null, activos: null, potenciales: null, metas: null };

// ================= SELECTOR DE USUARIO (Martu/José/Ambos) =================
window._usuarioActivo = localStorage.getItem('usuarioActivo') || 'Ambos';
function pintarSelectorUsuario() {

}
function cambiarUsuarioActivo(u) {
  window._usuarioActivo = u;
  localStorage.setItem('usuarioActivo', u);
  pintarSelectorUsuario();
  _flushEscrituras().then(() => {
    pintarVistaActual();
    if (document.getElementById('view-clientes').classList.contains('active')) { cargarActivos(''); filtrarYRenderizarPotenciales(); }
    if (document.getElementById('view-captaciones').classList.contains('active')) pintarCaptaciones();
  });
}
/** true si un asesor/agente corresponde al usuario activo (o si está en "Ambos"). */
function _coincideUsuario(asesor) {
  if (window._usuarioActivo === 'Ambos') return true;
  return asesor === window._usuarioActivo;
}

function mostrar(v) {
  const vistaAnterior = document.querySelector('.view.active') ? document.querySelector('.view.active').id.replace('view-','') : null;
  if (vistaAnterior === 'captaciones' && v !== 'captaciones') _flushEscrituras();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelector('.nav-item[data-view="' + v + '"]').classList.add('active');
  pintarHeaderBtns(v);
  if (v === 'agenda') { if (cacheVistas.agenda) renderizarDia(cacheVistas.agenda); pintarVistaActual(); }
  if (v === 'clientes') { if (cacheVistas.activos) renderizarActivos(cacheVistas.activos); cargarActivos(''); }
  if (v === 'carga') iniciarChat();

}
// ---- Cola de escrituras diferidas: se actualiza en pantalla al toque, y se manda a la planilla en lote ----
window._pendingWrites = [];
function _encolarEscritura(accion, params) { window._pendingWrites.push({ accion: accion, params: params }); }
function _flushEscrituras() {
  if (!window._pendingWrites.length) return Promise.resolve();
  const lote = window._pendingWrites.splice(0, window._pendingWrites.length);
  return Promise.all(lote.map(w => apiCall(w.accion, w.params).catch(mostrarError)));
}
setInterval(() => { if (window._pendingWrites.length) _flushEscrituras(); }, 20000);
window.addEventListener('beforeunload', () => { if (window._pendingWrites.length) navigator.sendBeacon && _flushEscrituras(); });
function cambiarBloqueCarga(b, evt) {
  document.querySelectorAll('#view-carga > .top-toggle > .top-toggle-btn').forEach(x => x.classList.remove('active'));
  evt.target.classList.add('active');

  document.getElementById('bloque-carga-form').style.display = b === 'form' ? 'block' : 'none';

}
function mostrarBotonCargarTabla() {

    <button class="btn-continuar" onclick="pintarTablaConsultas()">📋 Ver tabla completa (puede tardar unos segundos)</button>

// ---- Tabla en vivo de Consultas Redes (con filtros por columna, como Excel) ----
let _tablaConsultasData = null;
let _filtrosColumna = {}; // { columna: Set(valoresSeleccionados) }
function pintarTablaConsultas() {
  document.getElementById('tabla-consultas-wrap').innerHTML = '<div class="loading">Cargando tabla…</div>';
  apiCall('getConsultasRedesTabla').then(function(data) {
    _tablaConsultasData = data;
    _filtrosColumna = {};
    data.headers.forEach(h => { _filtrosColumna[h] = null; }); // null = sin filtrar (todos)
    renderizarFiltrosTabla();
    renderizarTablaConsultas();
    if (data.totalReal > data.mostrando) {
      document.getElementById('tabla-consultas-wrap').insertAdjacentHTML('afterbegin', `<div class="loading" style="margin-bottom:8px">Mostrando las últimas ${data.mostrando} de ${data.totalReal} filas (para que ande rápido). Usá el buscador de Clientes para encontrar algo más viejo.</div>`);
    }
  }).catch(mostrarError);
}
function renderizarFiltrosTabla() {
  const cols = ['NOMBRE', 'ESTADO', 'ASESOR', 'TIPO DE PROP', 'BARRIO', 'ETAPA_CRM'].filter(c => _tablaConsultasData.headers.includes(c));
  document.getElementById('tabla-filtros').innerHTML = cols.map(col => {
    const valores = [...new Set(_tablaConsultasData.filas.map(f => (f[col] || '(vacío)').toString()))].sort();
    return `<div class="cap-toggle" onclick="toggleFiltroDropdown('${col}')">Filtro: ${col} ▾</div>
      <div id="filtro-${col.replace(/\s/g,'_')}" style="display:none" class="mes-filtro-wrap">
        <span class="mes-chip" onclick="filtroColumnaTodos('${col}', true)">Todos</span>
        <span class="mes-chip" onclick="filtroColumnaTodos('${col}', false)">Ninguno</span>
        <div class="mes-filtro-row">${valores.map(v => `<span class="mes-chip active" onclick="toggleValorFiltro('${col}','${v.replace(/'/g,"\\'")}')" id="chip-${col.replace(/\s/g,'_')}-${v.replace(/[^a-zA-Z0-9]/g,'')}">${v}</span>`).join('')}</div>
      </div>`;
  }).join('');
}
function toggleFiltroDropdown(col) {
  const el = document.getElementById('filtro-' + col.replace(/\s/g,'_'));
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function toggleValorFiltro(col, val) {
  if (!_filtrosColumna[col]) _filtrosColumna[col] = new Set([...new Set(_tablaConsultasData.filas.map(f => (f[col]||'(vacío)').toString()))]);
  const set = _filtrosColumna[col];
  const chip = document.getElementById('chip-' + col.replace(/\s/g,'_') + '-' + val.replace(/[^a-zA-Z0-9]/g,''));
  if (set.has(val)) { set.delete(val); chip.classList.remove('active'); } else { set.add(val); chip.classList.add('active'); }
  renderizarTablaConsultas();
}
function filtroColumnaTodos(col, todos) {
  const valores = [...new Set(_tablaConsultasData.filas.map(f => (f[col]||'(vacío)').toString()))];
  _filtrosColumna[col] = todos ? null : new Set();
  renderizarFiltrosTabla();
  renderizarTablaConsultas();
}
function renderizarTablaConsultas() {
  let filas = _tablaConsultasData.filas;
  Object.keys(_filtrosColumna).forEach(col => {
    const set = _filtrosColumna[col];
    if (set) filas = filas.filter(f => set.has((f[col]||'(vacío)').toString()));
  });
  const headers = _tablaConsultasData.headers.filter(h => !h.endsWith('_JSON'));
  const html = `<table style="border-collapse:collapse;width:100%;font-size:11px">
    <thead><tr>${headers.map(h => `<th style="text-align:left;padding:6px 8px;background:var(--card);position:sticky;top:0;white-space:nowrap">${h}</th>`).join('')}</tr></thead>
    <tbody>${filas.map(f => `<tr>${headers.map(h => `<td style="padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap" contenteditable="true" onblur="editarCeldaTabla(${f._fila},'${h}',this.innerText)">${f[h] || ''}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
  document.getElementById('tabla-consultas-wrap').innerHTML = html || '<div class="loading">Sin resultados con estos filtros.</div>';
}
function editarCeldaTabla(fila, columna, valor) {
  apiCall('actualizarCeldaConsulta', { fila: fila, columna: columna, valor: valor }).catch(mostrarError);
}

// ---- Carga con IA: extrae TODOS los campos y los muestra en un formulario de revisión con selects ----
function abrirCargaIACompleta() {
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">Cargar con IA</div>
    <div class="modal-sub">Pegá el texto (WhatsApp, lead de Meta, etc.) y/o subí una imagen</div>

    <div class="modal-cancelar" onclick="cerrarModal()">Cancelar</div>`;
  document.getElementById('modal-overlay').classList.add('active');
}
function procesarCargaIACompleta() {
  const texto = document.getElementById('ia-texto').value.trim();
  const file = document.getElementById('ia-imagen').files[0];
  const seguir = (base64) => {
    apiCall('extraerLeadCompletoIA', { texto: texto, imagen: base64 }).then(function(d) {
      if (d.error) { mostrarError(new Error(d.error)); return; }
      mostrarRevisionCargaIA(d);
    }).catch(mostrarError);
  };
  if (file) {
    const reader = new FileReader();
    reader.onload = () => seguir(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  } else { seguir(null); }
}
function mostrarRevisionCargaIA(d) {
  const opcionesEstado = ['', 'Contactado', 'Fantasma'];
  const opcionesTipo = ['', 'Departamento', 'PH', 'Casa', 'Terreno', 'Local'];
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">Revisá antes de guardar</div>

    <label class="q">Dirección</label><input class="q" id="rev-DIRECCION" value="${d.DIRECCION||''}">
    <label class="q">Estado</label><select class="q" id="rev-ESTADO">${opcionesEstado.map(o => `<option ${d.ESTADO===o?'selected':''}>${o}</option>`).join('')}</select>
    <label class="q">Tipo de propiedad</label><select class="q" id="rev-TIPO_DE_PROP">${opcionesTipo.map(o => `<option ${d['TIPO DE PROP']===o?'selected':''}>${o}</option>`).join('')}</select>
    <label class="q">Dormitorios</label><input class="q" id="rev-DORMITORIOS" value="${d.DORMITORIOS||''}">
    <label class="q">Barrio</label><input class="q" id="rev-BARRIO" value="${d.BARRIO||''}">
    <label class="q">Valor</label><input class="q" id="rev-VALOR" value="${d.VALOR||''}">
    <label class="q">Observación</label><textarea class="q" id="rev-OBSERVACION" rows="2">${d.OBSERVACION||''}</textarea>
    <label class="q">Asesor</label><select class="q" id="rev-ASESOR"><option value="">-</option><option ${'Martu'==='Martu'?'':''}>Martu</option><option>Jose</option></select>
    <button class="btn-continuar" onclick="guardarCargaIACompleta()">Guardar</button>
    <div class="modal-cancelar" onclick="cerrarModal()">Cancelar</div>`;
}
function guardarCargaIACompleta() {
  if (_bloqueadoAhora()) return;
  const nombre = document.getElementById('rev-NOMBRE').value.trim();
  const telefono = document.getElementById('rev-TELEFONO').value.trim();
  if (!nombre) { alert('Falta el nombre.'); return; }
  const datos = {
    NOMBRE: nombre, TELEFONO: telefono,
    DIRECCION: document.getElementById('rev-DIRECCION').value.trim(),
    ESTADO: document.getElementById('rev-ESTADO').value,
    'TIPO DE PROP': document.getElementById('rev-TIPO_DE_PROP').value,
    DORMITORIOS: document.getElementById('rev-DORMITORIOS').value.trim(),
    BARRIO: document.getElementById('rev-BARRIO').value.trim(),
    VALOR: document.getElementById('rev-VALOR').value.trim(),
    OBSERVACION: document.getElementById('rev-OBSERVACION').value.trim(),
    ASESOR: document.getElementById('rev-ASESOR').value
  };
  apiCall('chequearDuplicado', { nombre: nombre, telefono: telefono }).then(function(dup) {
    if (dup.duplicado && dup.sheet && confirm('Ya existe "' + dup.nombre + '". ¿Cargar sobre ese contacto en vez de crear uno nuevo?')) {
      apiCall('actualizarSobreExistente', { sheet: dup.sheet, fila: dup.fila, datos: datos })
        .then(() => { cerrarModal(); pintarTablaConsultas(); alert('Actualizado.'); }).catch(mostrarError);
      return;
    }
    apiCall('agregarConsultaRapida', { datos: datos }).then(() => { cerrarModal(); pintarTablaConsultas(); alert('Guardado.'); }).catch(mostrarError);
  }).catch(mostrarError);
}
function pintarHeaderBtns(v) {

function mostrarError(err) {

}

// ================= AGENDA (todo desde el snapshot local de Calendar) =================
let diaMostrado = new Date();
let modoCal = 'dia';
const HORAS = []; for (let h = 8; h <= 23; h++) HORAS.push(h);

/** Trae TODO el Calendar de una vez. Se llama al iniciar la app, y de nuevo después de cualquier acción que escriba algo. */
function refrescarSnapshot() {
  return apiCall('getSnapshotCalendario').then(function(lista) { window._calSnapshot = lista; return lista; });

const CAL_ID_JOSE = ['279f4aa568cbf532753d90ab00a99e978930f92d93fda86aff4a42ae93aaf207@group.calendar.google.com', 'b336dc05267549bf8484438b6c1ad7cf5817203b0a24d0f04ac594c2f3bc3a60@group.calendar.google.com'];
const CAL_ID_MARTU = ['fc5100a8f10470d43c12dfafde28085b8c3640515989dc2e848b9405d90ebf61@group.calendar.google.com', 'b789c6d2174a0630602060d8b16fe5b242bc3925fb1e983b585f8a7908872bbf@group.calendar.google.com'];
function _eventoPasaFiltroUsuario(ev) {
  if (window._usuarioActivo === 'Ambos') return true;
  if (window._usuarioActivo === 'Jose' && CAL_ID_MARTU.includes(ev.calId)) return false;
  if (window._usuarioActivo === 'Martu' && CAL_ID_JOSE.includes(ev.calId)) return false;
  return true; // Reuniones, Captación, Personal, Solumitos: siempre visibles
}
function _eventosEnRango(inicio, fin) {
  if (!window._calSnapshot) return [];
  return window._calSnapshot.filter(function(ev) {
    const i = new Date(ev.inicioISO);
    return i >= inicio && i < fin && _eventoPasaFiltroUsuario(ev);
  });
}

function pintarVistaActual() {
  if (modoCal === 'dia') pintarDia();
  else if (modoCal === 'semana') pintarSemana();
  else pintarMes();
}
function cambiarModoCal(m) {

  document.querySelectorAll('.modo-cal-btn').forEach(b => b.classList.toggle('active', b.dataset.modo === m));
  document.querySelectorAll('.cal-vista').forEach(v => v.classList.remove('active'));
  document.getElementById('cal-vista-' + m).classList.add('active');
  pintarVistaActual();
}
function mismoDia(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

// ---- SEMANA ----
function pintarSemana() {
  const lunes = new Date(diaMostrado);
  const diaSemana = (lunes.getDay() + 6) % 7;
  lunes.setDate(lunes.getDate() - diaSemana);
  const dias = []; for (let i = 0; i < 7; i++) { const d = new Date(lunes); d.setDate(d.getDate() + i); dias.push(d); }
  const HORAS_SEMANA = []; for (let h = 8; h <= 20; h++) HORAS_SEMANA.push(h);
  const alturaHora = 38;

  if (!window._calSnapshot) { document.getElementById('semana-inner').innerHTML = '<div class="loading">Cargando semana…</div>'; return; }
  let html = `<div class="semana-hourcol"><div style="height:24px"></div>`;
  HORAS_SEMANA.forEach(h => html += `<div class="semana-hourcell">${String(h).padStart(2,'0')}:00</div>`);
  html += `</div>`;
  dias.forEach((dia) => {
    const finDia = new Date(dia); finDia.setDate(finDia.getDate() + 1);
    const eventos = _eventosEnRango(dia, finDia).filter(ev => { const h = new Date(ev.inicioISO).getHours(); return h >= 8 && h <= 20; });
    let col = `<div class="semana-daycol">`;
    col += `<div class="semana-dayhead ${mismoDia(dia, new Date()) ? 'hoy' : ''}" onclick="irADiaSemana('${dia.toISOString()}')">${dia.toLocaleDateString('es-AR',{weekday:'short'})} ${dia.getDate()}</div>`;
    col += `<div class="semana-daybody" style="height:${HORAS_SEMANA.length*alturaHora}px">`;
    HORAS_SEMANA.forEach(() => col += `<div class="semana-hourline"></div>`);
    eventos.forEach(ev => {
      const inicio = new Date(ev.inicioISO), fin = new Date(ev.finISO);
      const inicioH = inicio.getHours() + inicio.getMinutes()/60, finH = fin.getHours() + fin.getMinutes()/60;
      const top = (inicioH - 8) * alturaHora, height = Math.max((finH - inicioH) * alturaHora - 2, 16);
      col += `<div class="semana-event ev-${ev.clase} ${ev.completada?'completada':''}" style="top:${top}px;height:${height}px" onclick="marcarHecho('${ev.id}')">${ev.completada?'✓ ':''}${ev.titulo}</div>`;
    });
    col += `</div></div>`;
    html += col;
  });
  document.getElementById('semana-inner').innerHTML = html;
}

function pintarMes() {
  const anio = diaMostrado.getFullYear(), mes = diaMostrado.getMonth();
  if (!window._calSnapshot) { document.getElementById('mes-grid').innerHTML = '<div class="loading">Cargando…</div>'; return; }
  const inicioMes = new Date(anio, mes, 1), finMes = new Date(anio, mes + 1, 1);
  const eventosMes = _eventosEnRango(inicioMes, finMes);
  const porDia = {};
  eventosMes.forEach(ev => { const d = new Date(ev.inicioISO).getDate(); porDia[d] = porDia[d] || []; porDia[d].push(ev.clase); });
  const dow = ['L','M','M','J','V','S','D'];
  let html = dow.map(d => `<div class="mes-dow">${d}</div>`).join('');
  const offset = (inicioMes.getDay() + 6) % 7;
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  for (let i = 0; i < offset; i++) html += `<div class="mes-cell" style="visibility:hidden"></div>`;
  for (let d = 1; d <= diasEnMes; d++) {
    const fecha = new Date(anio, mes, d);
    const esHoy = mismoDia(fecha, new Date());
    const clases = (porDia[d] || []).slice(0, 4);
    const dots = clases.map(c => `<div class="mes-dot ev-${c}"></div>`).join('');
    html += `<div class="mes-cell ${esHoy?'hoy':''}" onclick="irADiaMes(${anio},${mes},${d})">${d}<div class="mes-dots">${dots}</div></div>`;
  }
  document.getElementById('mes-grid').innerHTML = html;
}
function irADiaMes(anio, mes, d) { diaMostrado = new Date(anio, mes, d); cambiarModoCal('dia'); }
function navegar(delta, el) {
  if (el) { el.classList.add('pulsando'); setTimeout(() => el.classList.remove('pulsando'), 200); }
  diaMostrado.setDate(diaMostrado.getDate() + delta);
  pintarVistaActual();
}
function pintarDia() {
  document.getElementById('cal-day-lbl').innerText = diaMostrado.toLocaleDateString('es-AR', { weekday: 'short' }).toUpperCase();
  document.getElementById('cal-num-lbl').innerText = diaMostrado.getDate();

  if (!window._calSnapshot) { document.getElementById('cal-grid').innerHTML = '<div class="loading">Cargando…</div>'; return; }
  const inicio = new Date(diaMostrado); inicio.setHours(0,0,0,0);
  const fin = new Date(diaMostrado); fin.setHours(23,59,59,999);
  renderizarDia(_eventosEnRango(inicio, fin));
}
/** Propone 3 horarios evitando choques, usando el snapshot local (no le pide nada al servidor). */
function proponerHorariosLocal(fechaMinISO) {
  const fechaMin = fechaMinISO ? new Date(fechaMinISO) : new Date();
  const candidatos = [];
  const base1 = new Date(fechaMin); base1.setDate(base1.getDate() + 1); base1.setHours(10, 0, 0, 0);
  const base2 = new Date(fechaMin); base2.setDate(base2.getDate() + 1); base2.setHours(15, 0, 0, 0);
  const base3 = new Date(fechaMin); base3.setDate(base3.getDate() + 2); base3.setHours(9, 0, 0, 0);
  const snapshot = window._calSnapshot || [];
  [base1, base2, base3].forEach(function(candidato) {
    const finCandidato = new Date(candidato.getTime() + 30 * 60000);
    const choca = snapshot.some(ev => {
      const i = new Date(ev.inicioISO), f = new Date(ev.finISO);
      return candidato < f && finCandidato > i;
    });
    const final = choca ? new Date(candidato.getTime() + 60 * 60000) : candidato;
    candidatos.push(final.toISOString());
  });
  return candidatos;
}
function renderizarDia(eventos) {
  let filas = '';
  HORAS.forEach(h => filas += `<div class="cal-hour-row"><div class="cal-hour-lbl">${String(h).padStart(2,'0')}:00</div><div class="cal-hour-line" onclick="abrirTareaManual(${h})"></div></div>`);
  const alturaHora = 80;
  const SEPARACION = 4;

  const conRango = eventos.map(ev => {
    const inicio = new Date(ev.inicioISO), fin = new Date(ev.finISO);
    return Object.assign({}, ev, { _inicio: inicio, _fin: fin });
  }).sort((a, b) => a._inicio - b._inicio);

  // Agrupa eventos que se solapan en el tiempo y les asigna columna (col) y total de columnas (cols) del grupo.
  const grupos = [];
  conRango.forEach(ev => {
    let grupo = grupos.find(g => g.some(e => ev._inicio < e._fin && ev._fin > e._inicio));
    if (!grupo) { grupo = []; grupos.push(grupo); }
    grupo.push(ev);
  });
  grupos.forEach(grupo => {
    grupo.forEach((ev, i) => { ev._col = i; ev._cols = grupo.length; });
  });

  // Calcula top/height iniciales.
  conRango.forEach(ev => {
    const inicioH = ev._inicio.getHours() + ev._inicio.getMinutes() / 60, finH = ev._fin.getHours() + ev._fin.getMinutes() / 60;
    ev._top = (inicioH - 8) * alturaHora;
    ev._height = Math.max((finH - inicioH) * alturaHora - SEPARACION, 24);
  });

  // Garantiza separación real: dentro de cada columna, ningún bloque puede pisar al siguiente.
  const porColumna = {};
  conRango.forEach(ev => {
    const key = ev._col + '|' + ev._cols;
    porColumna[key] = porColumna[key] || [];
    porColumna[key].push(ev);
  });
  Object.values(porColumna).forEach(lista => {
    lista.sort((a, b) => a._top - b._top);
    for (let i = 0; i < lista.length - 1; i++) {
      const actual = lista[i], siguiente = lista[i + 1];
      const maxAltura = siguiente._top - actual._top - SEPARACION;
      if (actual._height > maxAltura) actual._height = Math.max(maxAltura, 18);
    }
  });

  const html = conRango.map(ev => {
    const anchoPct = 100 / ev._cols;
    const leftPct = anchoPct * ev._col;
    const compacto = ev._height < 34 ? 'compacto' : '';
    const horaTxt = ev._inicio.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const subTxt = [ev.cliente, ev.ubicacion].filter(Boolean).join(' · ');
    const contenido = compacto
      ? `${ev.completada ? '✓ ' : ''}${horaTxt} · ${ev.titulo}${subTxt ? ' · ' + subTxt : ''}`
      : `${ev.completada ? '✓ ' : ''}${ev.titulo}<div class="sub">${horaTxt}${subTxt ? ' · ' + subTxt : ''}</div>`;
    return `<div class="cal-event ev-${ev.clase} ${ev.completada ? 'completada' : ''} ${compacto}" style="top:${ev._top}px;height:${ev._height}px;left:calc(${leftPct}% + 2px);width:calc(${anchoPct}% - 4px);right:auto" onclick="marcarHecho('${ev.id}')">${contenido}</div>`;
  }).join('');
  document.getElementById('cal-grid').innerHTML = filas + `<div class="cal-events-layer">${html}</div>`;
}

function cambiarBloqueClientes(b, evt) {

  document.getElementById('bloque-potenciales').style.display = b === 'potenciales' ? 'block' : 'none';
  if (b === 'potenciales') cargarPotenciales();
}
function cargarActivos(filtro) {
  apiCall('getClientesActivos', { filtro: filtro || '' }).then(function(clientes) {
    clientes = clientes.filter(c => _coincideUsuario(c.asesor));
    _cruzarConSnapshot(clientes);
    cacheVistas.activos = clientes;
    renderizarActivos(clientes);
  }).catch(mostrarError);
}
/** Le agrega proximaTarea/proximaFechaISO a cada cliente cruzando contra window._calSnapshot (sin pedirle nada a Calendar). */
function _cruzarConSnapshot(clientes) {
  const snapshot = window._calSnapshot || [];
  clientes.forEach(function(c) {
    const evs = snapshot.filter(ev => ev.sheet === c.sheet && ev.fila === c.fila && !ev.completada)
      .sort((a, b) => new Date(a.inicioISO) - new Date(b.inicioISO));
    if (evs.length) { c.proximaTarea = evs[0].titulo; c.proximaFechaISO = evs[0].inicioISO; }
    else { c.proximaTarea = '(sin tarea agendada)'; c.proximaFechaISO = null; }
  });
  clientes.sort(function(a, b) {
    if (!a.proximaFechaISO) return 1;
    if (!b.proximaFechaISO) return -1;
    return new Date(a.proximaFechaISO) - new Date(b.proximaFechaISO);
  });
}
const ORDEN_ETAPAS = ['Contacto nuevo','Prelisting','Presentación de ACM','Publicación','Esperando info','Búsqueda permuta','Búsqueda activa','Muestra','Reserva','Cierre'];
const COLOR_ETAPA = {
  'Contacto nuevo': '#D9823E', 'Prelisting': '#CDD24C', 'Presentación de ACM': '#5DCB5B', 'Publicación': '#14DBA0',
  'Esperando info': '#3FC0F5', 'Búsqueda permuta': '#3D5FF5', 'Búsqueda activa': '#9B2FF2', 'Muestra': '#F62FE8',
  'Reserva': '#FF2E82', 'Cierre': '#FF3B45'
};
function renderizarActivos(clientes) {
  const grupos = {};
  clientes.forEach(c => { grupos[c.etapa] = grupos[c.etapa] || []; grupos[c.etapa].push(c); });
  const etapasOrdenadas = ORDEN_ETAPAS.concat(Object.keys(grupos).filter(e => !ORDEN_ETAPAS.includes(e)));
  document.getElementById('grupos-activos').innerHTML = etapasOrdenadas.map(etapa => {
    const items = grupos[etapa] || [];
    const color = (items[0] && items[0].color) || COLOR_ETAPA[etapa] || '#8b8fa8';
    const filas = items.map(c => `
      <div class="cliente-row" onclick="abrirPerfil('${c.sheet}', ${c.fila})">
        <div style="flex:1"><div class="cliente-nombre">${c.nombre}${c.asesor ? ' <span style="color:var(--muted);font-weight:500;font-size:10.5px">· ' + c.asesor + '</span>' : ''}</div><div class="cliente-tarea">${c.proximaTarea}${c.proximaFechaISO ? ' · ' + new Date(c.proximaFechaISO).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) : ''}</div></div>
        <div class="cliente-actions">
          <button class="icon-btn" onclick="event.stopPropagation();abrirWhatsapp('${c.telefono}')">💬</button>
        </div>
      </div>`).join('') || '<div class="loading" style="padding:8px 4px">Sin clientes en esta etapa.</div>';
    return `<div class="grupo" style="background:${color}"><div class="grupo-head" onclick="this.parentElement.classList.toggle('abierto')"><span>${etapa} (${items.length})</span><span class="chev">⌄</span></div><div class="grupo-body">${filas}</div></div>`;
  }).join('');
}

const TAGS_DISPONIBLES = ['Inversor', 'Recicla', 'Departamento', 'PH', 'Casa'];
let tagsActivos = [];
function pintarTagsFiltro() {
  document.getElementById('tags-filtro').innerHTML = TAGS_DISPONIBLES.map(t => `<div class="tag-filtro ${tagsActivos.includes(t)?'active':''}" onclick="toggleTag('${t}')">${t}</div>`).join('');
}
function toggleTag(t) { tagsActivos = tagsActivos.includes(t) ? tagsActivos.filter(x=>x!==t) : tagsActivos.concat(t); pintarTagsFiltro(); filtrarYRenderizarPotenciales(); }
function cargarPotenciales() {
  // Caché-primero: si ya tenemos los datos, se filtran al instante mientras se refresca atrás.
  if (cacheVistas.potencialesCrudo) filtrarYRenderizarPotenciales();
  apiCall('getPotencialesCrudo').then(function(lista) {
    cacheVistas.potencialesCrudo = lista;
    filtrarYRenderizarPotenciales();
  }).catch(mostrarError);
}
/** Filtra por texto + tags en el navegador (sin pedirle nada al servidor) — se llama en cada letra que se escribe. */
function filtrarYRenderizarPotenciales() {
  if (!cacheVistas.potencialesCrudo) { document.getElementById('lista-potenciales').innerHTML = '<div class="loading">Cargando…</div>'; return; }
  const q = (document.querySelector('#bloque-potenciales .buscador').value || '').toLowerCase();
  let lista = cacheVistas.potencialesCrudo;
  lista = lista.filter(p => !p.asesor || _coincideUsuario(p.asesor));
  if (q) lista = lista.filter(p => p.nombre.toLowerCase().indexOf(q) !== -1);
  if (tagsActivos.length) {
    lista = lista.filter(p => tagsActivos.every(t => {
      if (t === 'Inversor') return p.inversor;
      if (t === 'Recicla') return p.reciclaje;
      return (p.tipoPropiedad || '').indexOf(t) !== -1;
    }));
  }
  document.getElementById('lista-potenciales').innerHTML = lista.map(p => `
    <div class="potencial-card" onclick="abrirPerfil('${p.sheet}', ${p.fila})">
      <div class="cliente-nombre">${p.nombre}</div><div class="cliente-tarea">${p.telefono}</div>

}

// ================= CARGA (chat con IA) =================
let chatHistorial = [];
let chatDatosAcumulados = {};
function chatMsgs() { return document.getElementById('chat-msgs'); }
function addBotMsg(t) { const d=document.createElement('div'); d.className='msg msg-bot'; d.innerText=t; chatMsgs().appendChild(d); chatMsgs().scrollTop=chatMsgs().scrollHeight; }
function addUserMsg(t) { const d=document.createElement('div'); d.className='msg msg-user'; d.innerText=t; chatMsgs().appendChild(d); chatMsgs().scrollTop=chatMsgs().scrollHeight; }
function addLoadingMsg() { const d=document.createElement('div'); d.className='msg msg-bot'; d.id='chat-loading'; d.innerText='…'; chatMsgs().appendChild(d); chatMsgs().scrollTop=chatMsgs().scrollHeight; }
function quitarLoadingMsg() { const d=document.getElementById('chat-loading'); if (d) d.remove(); }
function addQuickReplies(ops, cb) {
  const wrap=document.createElement('div'); wrap.className='quick-replies';
  ops.forEach(op => { const b=document.createElement('div'); b.className='quick-reply'; b.innerText=op; b.onclick=()=>{addUserMsg(op);wrap.remove();cb(op);}; wrap.appendChild(b); });
  chatMsgs().appendChild(wrap); chatMsgs().scrollTop=chatMsgs().scrollHeight;
}
function iniciarChat() {
  chatMsgs().innerHTML = '';
  chatHistorial = [];
  chatDatosAcumulados = {};
  addBotMsg('Hola 👋 Contame de quién se trata, o mandame una captura de WhatsApp o de un lead de Meta.');
}
function enviarChat() {
  const input = document.getElementById('chat-input');
  const t = input.value.trim();
  if (!t) return;
  addUserMsg(t);
  input.value = '';
  chatHistorial.push({ role: 'user', text: t });
  llamarIA();
}
function enviarImagenChat(inputFile) {
  const file = inputFile.files[0];
  if (!file) return;
  addUserMsg('📷 Imagen enviada');
  const reader = new FileReader();
  reader.onload = function() {
    const base64 = reader.result.split(',')[1];
    chatHistorial.push({ role: 'user', text: '(el usuario adjuntó una imagen, leela)', imagenBase64: base64 });
    llamarIA();
  };
  reader.readAsDataURL(file);
  inputFile.value = '';
}
function llamarIA() {
  addLoadingMsg();
  apiCall('procesarMensajeIA', { historial: chatHistorial }).then(function(res) {
    quitarLoadingMsg();
    if (res.error) { mostrarError(new Error(res.error)); return; }
    ['nombre','telefono','barrio','tipoPropiedad','dormitorios','valor','observacion'].forEach(k => {
      if (res[k]) chatDatosAcumulados[k] = res[k];
    });
    addBotMsg(res.respuesta || '¿Podés repetirlo?');
    chatHistorial.push({ role: 'bot', text: res.respuesta || '' });
    if (res.listoParaGuardar) {
      addQuickReplies(['Sí, guardar', 'Todavía no'], function(op) {
        if (op.indexOf('Sí') !== -1) confirmarGuardarChat();
        else { addBotMsg('Dale, seguí contándome.'); }
      });
    }
  }).catch(function(err) { quitarLoadingMsg(); mostrarError(err); });
}
function confirmarGuardarChat() {
  if (_bloqueadoAhora()) return;
  apiCall('chequearDuplicado', { nombre: chatDatosAcumulados.nombre || '', telefono: chatDatosAcumulados.telefono || '' }).then(function(dup) {
    if (dup.duplicado) {
      addBotMsg('⚠️ Ya existe un contacto parecido: ' + dup.nombre + ' (' + (dup.etapa || 'Potencial') + '). ¿Qué hacemos?');
      const opciones = dup.sheet ? ['Cargar sobre ese contacto', 'Crear uno nuevo igual', 'Cancelar'] : ['Crear uno nuevo igual', 'Cancelar'];
      addQuickReplies(opciones, function(op) {
        if (op.indexOf('sobre ese') !== -1) guardarSobreExistenteChat(dup.sheet, dup.fila);
        else if (op.indexOf('nuevo') !== -1) guardarDesdeChat();
        else addBotMsg('Cancelado. ¿Cargamos otro?');
      });
    } else {
      guardarDesdeChat();
    }
  }).catch(mostrarError);
}
function guardarSobreExistenteChat(sheet, fila) {
  const datos = {
    TELEFONO: chatDatosAcumulados.telefono || '', BARRIO: chatDatosAcumulados.barrio || '',
    'TIPO DE PROP': chatDatosAcumulados.tipoPropiedad || '', DORMITORIOS: chatDatosAcumulados.dormitorios || '',
    VALOR: chatDatosAcumulados.valor || '', OBSERVACION: chatDatosAcumulados.observacion || ''
  };
  apiCall('actualizarSobreExistente', { sheet: sheet, fila: fila, datos: datos }).then(function() {
    addBotMsg('✅ Actualizado sobre el contacto existente.');
    setTimeout(() => { addBotMsg('¿Cargamos otro?'); chatHistorial = []; chatDatosAcumulados = {}; }, 500);
  }).catch(mostrarError);
}
function guardarDesdeChat() {
  const datos = {
    NOMBRE: chatDatosAcumulados.nombre || '',
    TELEFONO: chatDatosAcumulados.telefono || '',
    BARRIO: chatDatosAcumulados.barrio || '',
    'TIPO DE PROP': chatDatosAcumulados.tipoPropiedad || '',
    DORMITORIOS: chatDatosAcumulados.dormitorios || '',
    VALOR: chatDatosAcumulados.valor || '',
    OBSERVACION: chatDatosAcumulados.observacion || ''
  };
  apiCall('agregarConsultaRapida', { datos: datos }).then(function() {
    addBotMsg('✅ Guardado. Tarea creada en tu agenda.');
    setTimeout(() => { addBotMsg('¿Cargamos otro?'); chatHistorial = []; chatDatosAcumulados = {}; }, 500);
  }).catch(mostrarError);
}

function renderizarMetas(m) {
  const items = m.items || [];
  const promedio = items.length ? items.reduce((s, it) => s + Math.min(1, it.avance / (it.meta || 1)), 0) / items.length : 0;
  let html = '';
  if (m.checkinSemanal && m.checkinSemanal.corresponde) {
    html += `<div class="checkin-banner">📋 ¿Hiciste Promoción en redes o alguna Capacitación la semana pasada?
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-chico" style="background:#062b23;color:var(--verde)" onclick="abrirCheckinSemanal(${m.checkinSemanal.cruzaMes},${m.checkinSemanal.mesAnterior},${m.checkinSemanal.mesActual})">Responder</button>
      </div></div>`;
  }
  html += `<div class="card"><div class="card-title">PROGRESO GENERAL DEL MES</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(promedio*100)}%;background:var(--verde)"></div></div>
    <div style="text-align:right;font-size:11px;color:var(--muted);margin-top:4px">${Math.round(promedio*100)}%</div></div>`;
  html += items.map(it => {
    const pct = Math.min(100, Math.round((it.avance / (it.meta || 1)) * 100));
    const pendientes = it.pendientes || [];
    return `<div class="card">
      <div class="card-title">${it.nombre.toUpperCase()}</div>
      <div class="bar-row"><div class="lbl-row"><span>${it.avance} hechas</span><span>meta: ${it.meta}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${pct>=100?'var(--verde)':'var(--naranja)'}"></div></div></div>
      ${pendientes.length ? `<div style="margin-top:10px"><div class="card-title" style="margin-bottom:6px">¿ESTAS CUENTAN?</div>
        ${pendientes.map(p => `<div class="cap-item"><div class="dir">${p.titulo}</div><div class="meta">${new Date(p.fechaISO).toLocaleDateString('es-AR')}</div>
          <div style="display:flex;gap:8px;margin-top:6px">
            <button class="btn-chico" style="background:var(--verde);color:#062b23" onclick="responderCandidatoMeta('${it.clave}','${p.id}','confirmado')">✓ Sí</button>
            <button class="btn-chico" style="background:var(--magenta);color:#fff" onclick="responderCandidatoMeta('${it.clave}','${p.id}','rechazado')">✗ No</button>
          </div></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('metas-contenido').innerHTML = html || '<div class="loading">No hay objetivos cargados para este mes en SOLUMITOS_DB.</div>';
}

let _mesesFiltroActivos = [];
let _prospeccionYaCargadaHoy = false;
function pintarCaptaciones() {
  // Caché-primero: si ya tenemos datos de antes, se ven al instante mientras se refresca atrás.
  if (cacheVistas.captacionesCrudo) renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo));
  apiCall('getCaptacionesCrudo').then(function(items) {
    cacheVistas.captacionesCrudo = items;
    renderizarCaptaciones(agruparCaptaciones(items));
  }).catch(mostrarError);
}
/** Agrupa por asesor y calcula efectividad/publicada — todo esto corre en el navegador, no en Apps Script. */
function agruparCaptaciones(items) {
  const agrupado = {};
  items.forEach(function(r) {
    const asesor = r.agente || 'Sin asignar';
    agrupado[asesor] = agrupado[asesor] || [];
    const noPublicar = r.estadoRaw === 'NO_PUBLICAR';
    const publicada = r.etapa === 'Publicación' || r.etapa === 'Cierre' || r.etapa === 'Ganado';
    agrupado[asesor].push(Object.assign({}, r, {
      estado: noPublicar ? 'No quiere publicar / Rechazó ACM' : r.estadoRaw,
      publicada: publicada, noPublicar: noPublicar,
      mesPublicacion: (publicada && r.fechaUltimoCambioISO) ? (new Date(r.fechaUltimoCambioISO).getMonth() + 1) : null
    }));
  });
  const resumen = {};
  Object.keys(agrupado).forEach(function(asesor) {
    const its = agrupado[asesor];
    const publicadas = its.filter(i => i.publicada).length;
    const noPublicar = its.filter(i => i.noPublicar).length;
    const totalIntentos = publicadas + noPublicar;
    resumen[asesor] = { publicadas: publicadas, noPublicar: noPublicar, efectividad: totalIntentos ? Math.round((publicadas / totalIntentos) * 100) : 0, items: its };
  });
  return resumen;
}
let _asesorTabActivo = null; // para el modo "Ambos": qué pestaña de asesor está elegida
window._capAbiertos = window._capAbiertos || {}; // recuerda qué secciones (Pendientes/Publicadas) quedaron abiertas
function renderizarCaptaciones(resumen) {
  const MESES = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if (!_mesesFiltroActivos.length) _mesesFiltroActivos = [new Date().getMonth() + 1];
  let html = `<div class="mes-filtro-wrap"><div class="card-title">FILTRAR PUBLICADAS POR MES</div>
    <div class="mes-filtro-row">
      <span class="mes-chip" onclick="filtroMesTodos(true)">Todos</span>
      <span class="mes-chip" onclick="filtroMesTodos(false)">Ninguno</span>
      ${MESES.slice(1).map((m,i) => `<span class="mes-chip ${_mesesFiltroActivos.includes(i+1)?'active':''}" onclick="toggleMesFiltro(${i+1})">${m}</span>`).join('')}
    </div></div>`;

  const asesores = Object.keys(resumen).filter(asesor => _coincideUsuario(asesor));
  const modoUnico = window._usuarioActivo !== 'Ambos'; // Martu o José: se ve directo, sin pestañas

  if (!modoUnico) {
    if (!_asesorTabActivo || !asesores.includes(_asesorTabActivo)) _asesorTabActivo = asesores[0];
    html += `<div class="top-toggle" style="margin-top:0">${asesores.map(a => `<div class="top-toggle-btn ${a===_asesorTabActivo?'active':''}" onclick="elegirAsesorTab('${a}')">${a}</div>`).join('')}</div>`;
  }

  const asesoresAMostrar = modoUnico ? asesores : [_asesorTabActivo].filter(Boolean);
  asesoresAMostrar.forEach(function(asesor) {
    const r = resumen[asesor];
    const vaBien = r.efectividad >= 50;
    const pendientes = r.items.filter(i => !i.publicada && !i.noPublicar);
    const publicadas = r.items.filter(i => i.publicada && (!i.mesPublicacion || _mesesFiltroActivos.includes(i.mesPublicacion)));
    const keyPend = asesor + '-pendientes', keyPub = asesor + '-publicadas';
    const abiertoPend = modoUnico || window._capAbiertos[keyPend];
    const abiertoPub = modoUnico || window._capAbiertos[keyPub];
    html += `<div class="agent-card ${vaBien?'ritmo-ok':'ritmo-mal'}">
      <div class="agent-card-header"><div class="name">${asesor}<span class="ritmo-tag ${vaBien?'ok':'mal'}">${vaBien?'En ritmo':'Atrasado'}</span></div>
      <div class="effectiveness-badge">${r.efectividad}% efectividad</div></div>
      ${!modoUnico ? `<div class="cap-toggle" onclick="toggleSeccionCap('${keyPend}')">Pendientes (${pendientes.length}) ▾</div>` : `<div class="card-title" style="margin-top:10px">PENDIENTES (${pendientes.length})</div>`}
      <div id="sec-${keyPend.replace(/[^a-zA-Z0-9]/g,'')}" style="display:${abiertoPend?'block':'none'}">${pendientes.map(i => captacionCardHtml(i)).join('') || '<div class="loading">Sin pendientes.</div>'}</div>
      ${!modoUnico ? `<div class="cap-toggle" onclick="toggleSeccionCap('${keyPub}')">Publicadas (${publicadas.length}) ▾</div>` : `<div class="card-title" style="margin-top:10px">PUBLICADAS (${publicadas.length})</div>`}
      <div id="sec-${keyPub.replace(/[^a-zA-Z0-9]/g,'')}" style="display:${abiertoPub?'block':'none'}">${publicadas.map(i => captacionCardHtml(i)).join('') || '<div class="loading">Sin publicadas en estos meses.</div>'}</div>
    </div>`;
  });
  document.getElementById('captaciones-agentes').innerHTML = html;
}
function elegirAsesorTab(a) { _asesorTabActivo = a; renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo)); }
function toggleSeccionCap(key) {
  window._capAbiertos[key] = !window._capAbiertos[key];
  renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo));
}
const CHECKLIST_CAPTACION = [
  { key: 'prelisting', label: 'PRELISTING' },
  { key: 'acm', label: 'ACM' },
  { key: 'documentacion', label: 'DOCUMENTACIÓN' },
  { key: 'fotos', label: 'FOTOS' },
  { key: 'publicada', label: 'PUBLICADA' }
];
function captacionCardHtml(i) {
  const completadas = i.etapasCompletadas || [];
  const completadosPipeline = completadas.filter(k => CHECKLIST_CAPTACION.some(p => p.key === k));
  const pct = Math.round((completadosPipeline.length / CHECKLIST_CAPTACION.length) * 100);
  const precio = i.valorEstimado ? (('' + i.valorEstimado).indexOf('$') !== -1 ? i.valorEstimado : '$' + i.valorEstimado) : 'Sin precio';
  const idExtra = 'extra-' + i.fila;
  return `<div class="cap-item">
    <div class="cap-top">
      <div class="cap-titulos">
        <div class="cap-dir">${i.direccion || '(sin dirección)'}</div>
        <div class="cap-sub">${i.tipo || '-'}<span class="dot">•</span>${i.lugar || '-'}${i.propietario ? `<span class="dot">•</span><span class="prop">${i.propietario}</span>` : ''}</div>
      </div>
      <div class="cap-precio-wrap">
        <div class="cap-precio">${precio}</div>
        <div class="cap-edit-btn" onclick="abrirEditarCaptacion(${i.fila})" title="Editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>
    </div>
    <div class="cap-pills">
      ${CHECKLIST_CAPTACION.map(e => `<span class="pill ${completadas.includes(e.key)?'on':''}" onclick="toggleChecklistCaptacion(${i.fila},'${e.key}')">${e.label}</span>`).join('')}
      <span class="pill baja ${i.noPublicar?'on':''}" onclick="toggleBajaCaptacion(${i.fila}, ${i.noPublicar ? 'false' : 'true'})">BAJA</span>
    </div>
    <div class="cap-progreso-wrap">
      <div class="cap-progreso-track"><div class="cap-progreso-fill" style="width:${pct}%;${i.noPublicar ? 'background:linear-gradient(90deg,#ff4d5e,var(--naranja))' : ''}"></div></div>
      <div class="cap-progreso-footer">
        <div class="cap-fecha">Inicio: <b>${i.fechaInicio || i.fechaAlta || '-'}</b></div>
        <div class="cap-progreso-pct">${pct}%</div>
      </div>
    </div>
    <div class="cap-extra-title" onclick="document.getElementById('${idExtra}').style.display=document.getElementById('${idExtra}').style.display==='none'?'block':'none'">Ver más datos ▾</div>
    <div id="${idExtra}" style="display:none">
      <div class="cap-extra">Etapa pipeline: ${i.etapa || '-'} · Estado: ${i.estado || '-'}</div>
      <div class="cap-extra">Agente: ${i.agente || '-'}</div>
      <div class="cap-extra">Fecha de alta: ${i.fechaAlta || '-'}</div>
      <div class="cap-extra">Fotos: ${i.fotos || '-'}</div>
      <div class="cap-extra">Autorización: ${i.autorizacion || '-'} · Escritura: ${i.escritura || '-'} · Impuestos: ${i.impuestos || '-'}</div>
      ${i.observacion ? `<div class="cap-extra">Obs.: ${i.observacion}</div>` : ''}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${(!i.publicada && !i.noPublicar) ? `<button class="btn-nopub" onclick="marcarNoPublicaClick(${i.fila})">No quiere publicar / Rechazó ACM</button>` : ''}
      ${i.noPublicar ? `<button class="btn-nopub" style="border-color:var(--verde);color:var(--verde)" onclick="deshacerNoPublicaClick(${i.fila})">↩ Deshacer</button>` : ''}
    </div>
  </div>`;
}
function toggleChecklistCaptacion(fila, key) {
  const item = (cacheVistas.captacionesCrudo || []).find(x => x.fila === fila);
  if (!item) return;
  const completadas = item.etapasCompletadas || [];
  const yaEstaba = completadas.includes(key);
  const nuevoValor = !yaEstaba;

  if (key === 'publicada' && nuevoValor) {
    window._pubTemp = { fila: fila, key: key, nuevoValor: nuevoValor };
    document.getElementById('modal-box').innerHTML = `
      <div class="modal-title">¿Fecha de publicación?</div>
      <button class="opcion-btn" onclick="confirmarPublicacion(null)">Hoy<span class="flecha">›</span></button>
      <label class="q">O elegí una fecha manual:</label><input type="date" id="fecha-pub-manual">
      <button class="btn-continuar" onclick="confirmarPublicacion(document.getElementById('fecha-pub-manual').value)">Confirmar fecha manual</button>
      <div class="modal-cancelar" onclick="cerrarModal()">Cancelar</div>`;
    document.getElementById('modal-overlay').classList.add('active');
  } else {
    _aplicarChecklistCaptacion(fila, key, nuevoValor, null);
  }
}
function confirmarPublicacion(fechaStr) {
  const t = window._pubTemp;
  cerrarModal();
  if (!t) return;
  _aplicarChecklistCaptacion(t.fila, t.key, t.nuevoValor, fechaStr ? new Date(fechaStr).toISOString() : null);
}
function _aplicarChecklistCaptacion(fila, key, nuevoValor, fechaISO) {
  const item = (cacheVistas.captacionesCrudo || []).find(x => x.fila === fila);
  if (!item) return;
  const completadas = item.etapasCompletadas || [];
  item.etapasCompletadas = nuevoValor ? completadas.concat(key) : completadas.filter(k => k !== key);
  // Actualiza en pantalla al instante; la escritura real a la planilla se manda en lote (no en cada click).
  renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo));
  _encolarEscritura('setEtapaCaptacionChecklist', { fila: fila, key: key, valor: nuevoValor, fecha: fechaISO || null });
}
function toggleBajaCaptacion(fila, marcar) {
  if (marcar && !confirm('¿Marcar como "No quiere publicar / Rechazó ACM"? Se cuenta para tu efectividad.')) return;
  const item = (cacheVistas.captacionesCrudo || []).find(x => x.fila === fila);
  if (item) item.noPublicar = marcar; // se ve al instante
  renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo));
  const accion = marcar ? 'marcarCaptacionNoPublicar' : 'deshacerNoPublicarCaptacion';
  apiCall(accion, { fila: fila }).then(pintarCaptaciones).catch(mostrarError);
}
function marcarNoPublicaClick(fila) { toggleBajaCaptacion(fila, true); }
function deshacerNoPublicaClick(fila) { toggleBajaCaptacion(fila, false); }
function abrirEditarCaptacion(fila) {
  const i = (cacheVistas.captacionesCrudo || []).find(x => x.fila === fila);
  if (!i) return;
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">Editar captación</div>
    <label class="q">Dirección</label><input class="q" id="ed-DIRECCION" value="${(i.direccion||'').replace(/"/g,'&quot;')}">
    <label class="q">Tipo</label><input class="q" id="ed-TIPO" value="${(i.tipo||'').replace(/"/g,'&quot;')}">
    <label class="q">Lugar/Barrio</label><input class="q" id="ed-LUGAR" value="${(i.lugar||'').replace(/"/g,'&quot;')}">
    <label class="q">Fotos</label><input class="q" id="ed-FOTOS" value="${(i.fotos||'').replace(/"/g,'&quot;')}">
    <label class="q">Fecha de inicio</label><input class="q" id="ed-FECHA_DE_INICIO" value="${(i.fechaInicio||'').replace(/"/g,'&quot;')}">
    <label class="q">Propietario</label><input class="q" id="ed-PROPIETARIO" value="${(i.propietario||'').replace(/"/g,'&quot;')}">
    <label class="q">Valor estimado</label><input class="q" id="ed-VALOR_ESTIMADO" value="${(i.valorEstimado||'').replace(/"/g,'&quot;')}">
    <label class="q">Autorización</label><input class="q" id="ed-AUTORIZACION" value="${(i.autorizacion||'').replace(/"/g,'&quot;')}">
    <label class="q">Escritura</label><input class="q" id="ed-ESCRITURA" value="${(i.escritura||'').replace(/"/g,'&quot;')}">
    <label class="q">Impuestos</label><input class="q" id="ed-IMPUESTOS" value="${(i.impuestos||'').replace(/"/g,'&quot;')}">
    <label class="q">Observación</label><textarea class="q" id="ed-OBSERVACION" rows="2">${i.observacion||''}</textarea>
    <button class="btn-continuar" onclick="guardarEditarCaptacion(${fila})">Guardar</button>
    <div class="modal-cancelar" onclick="cerrarModal()">Cancelar</div>`;
  document.getElementById('modal-overlay').classList.add('active');
}
function guardarEditarCaptacion(fila) {
  if (_bloqueadoAhora()) return;
  const datos = {
    DIRECCION: document.getElementById('ed-DIRECCION').value.trim(),
    TIPO: document.getElementById('ed-TIPO').value.trim(),
    LUGAR: document.getElementById('ed-LUGAR').value.trim(),
    FOTOS: document.getElementById('ed-FOTOS').value.trim(),
    'FECHA DE INICIO': document.getElementById('ed-FECHA_DE_INICIO').value.trim(),
    PROPIETARIO: document.getElementById('ed-PROPIETARIO').value.trim(),
    'VALOR ESTIMADO': document.getElementById('ed-VALOR_ESTIMADO').value.trim(),
    AUTORIZACION: document.getElementById('ed-AUTORIZACION').value.trim(),
    ESCRITURA: document.getElementById('ed-ESCRITURA').value.trim(),
    IMPUESTOS: document.getElementById('ed-IMPUESTOS').value.trim(),
    OBSERVACION: document.getElementById('ed-OBSERVACION').value.trim()
  };
  _encolarEscritura('actualizarCaptacion', { fila: fila, datos: JSON.stringify(datos) });
  Object.assign((cacheVistas.captacionesCrudo || []).find(x => x.fila === fila) || {}, {
    direccion: datos.DIRECCION, tipo: datos.TIPO, lugar: datos.LUGAR, fotos: datos.FOTOS, fechaInicio: datos['FECHA DE INICIO'],
    propietario: datos.PROPIETARIO, valorEstimado: datos['VALOR ESTIMADO'], autorizacion: datos.AUTORIZACION,
    escritura: datos.ESCRITURA, impuestos: datos.IMPUESTOS, observacion: datos.OBSERVACION
  });
  cerrarModal();
  renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo));
}
function toggleMesFiltro(m) {
  const idx = _mesesFiltroActivos.indexOf(m);
  if (idx === -1) _mesesFiltroActivos.push(m); else _mesesFiltroActivos.splice(idx, 1);
  renderizarCaptaciones(agruparCaptaciones(cacheVistas.captacionesCrudo)); // solo re-pinta las tarjetas, prospección queda intacta
}
function filtroMesTodos(todos) {
  _mesesFiltroActivos = todos ? Array.from({length:12}, (_,i)=>i+1) : [];

}
// ---- Prospección diaria ----
let _prospeccionLista = [];
function pintarProspeccionDelDia() {
  apiCall('getProspeccionDelDia').then(function(lista) {
    _prospeccionLista = lista;
    const html = `<div class="card-title" style="margin:14px 0 8px">PROSPECCIÓN DE HOY</div>` +
      lista.map((p, i) => `<div class="prospeccion-card" id="prosp-${i}">
        <div class="nombre">${p.nombre}</div>
        <div id="prosp-ia-${i}">
          <button class="btn-chico" style="background:var(--card-2);color:var(--text);border:1px solid var(--line)" onclick="activarAnalisisIA(${i})">🤖 Analizar con IA</button>
        </div>
        <button class="btn-chico" style="background:var(--verde);color:#062b23;margin-top:8px" onclick="marcarProspectadoClick('${p.sheet}',${p.fila},${i})">✓ Prospectado hoy</button>
      </div>`).join('');
    document.getElementById('prospeccion-wrap').innerHTML = html || '<div class="loading">Sin potenciales para hoy.</div>';
  }).catch(mostrarError);

function activarAnalisisIA(i) {
  const p = _prospeccionLista[i];
  document.getElementById('prosp-ia-' + i).innerHTML = '<div class="loading">Pensando qué preguntarte…</div>';
  apiCall('getPreguntasProspeccionIA', { nombre: p.nombre, datos: { tipoPropiedad: p.tipoPropiedad, inversor: p.inversor, reciclaje: p.reciclaje } }).then(function(res) {
    if (res.error || !res.preguntas || !res.preguntas.length) { document.getElementById('prosp-ia-' + i).innerHTML = '<div class="loading">No se pudo analizar. Probá de nuevo.</div>'; return; }
    window._prospPreguntas = window._prospPreguntas || {};
    window._prospPreguntas[i] = res.preguntas;
    document.getElementById('prosp-ia-' + i).innerHTML = res.preguntas.map((q, qi) => `
      <label class="q" style="margin-top:8px">${q}</label><input class="q" id="prosp-resp-${i}-${qi}" style="margin-bottom:4px">`).join('') +
      `<button class="btn-chico" style="background:var(--verde);color:#062b23;margin-top:4px" onclick="generarIdeaProspeccion(${i})">Generar idea de abordaje</button>`;
  }).catch(mostrarError);
}
function generarIdeaProspeccion(i) {
  const p = _prospeccionLista[i];
  const preguntas = (window._prospPreguntas || {})[i] || [];
  const respuestas = preguntas.map((_, qi) => (document.getElementById('prosp-resp-' + i + '-' + qi) || {}).value || '');
  document.getElementById('prosp-ia-' + i).innerHTML = '<div class="loading">Armando la idea…</div>';
  apiCall('getIdeaProspeccionIA', { nombre: p.nombre, datos: { tipoPropiedad: p.tipoPropiedad, inversor: p.inversor, reciclaje: p.reciclaje }, preguntas: preguntas, respuestas: respuestas })
    .then(function(res) {
      document.getElementById('prosp-ia-' + i).innerHTML = res.error ? '<div class="loading">No se pudo generar la idea.</div>' : `<div class="idea">💡 ${res.idea || ''}</div>`;
    }).catch(mostrarError);
}
function marcarProspectadoClick(sheet, fila, idx) {
  if (_bloqueadoAhora()) return;
  const avanzar = confirm('¿También lo pasamos al pipeline (Contacto nuevo)? Aceptar = sí, Cancelar = solo sumar a Metas.');
  apiCall('marcarProspectado', { sheet: sheet, fila: fila, avanzar: avanzar }).then(function() {
    const el = document.getElementById('prosp-' + idx);
    if (el) el.style.opacity = '.4';
    alert('Prospectado ✓ — sumado a Metas.');
  }).catch(mostrarError);
}

// ================= SALUDO Y FRASE MOTIVACIONAL =================
function pintarFraseMotivacional() {
  apiCall('getMetas').then(function(m) {
    cacheVistas.metas = m;
    const items = m.items || [];
    if (!items.length) { document.getElementById('frase-motivacional').innerText = ''; return; }
    const hoy = new Date();
    const diasMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
    const progresoEsperado = hoy.getDate() / diasMes;
    const progresoReal = items.reduce((s, it) => s + Math.min(1, it.avance / (it.meta || 1)), 0) / items.length;
    const diff = progresoReal - progresoEsperado;
    let frase;
    if (diff < -0.2) frase = '⚠️ Vas atrasada con las metas del mes — hoy es día de moverte en serio.';
    else if (diff < -0.08) frase = 'Un poco atrasada con las metas. Metele con todo hoy.';
    else if (diff < 0.08) frase = 'Vas en ritmo con las metas del mes. Seguí así 💪';
    else if (diff < 0.2) frase = 'Vas arriba de las metas — buen ritmo este mes.';
    else frase = '🔥 Estás volando este mes, vas a superar las metas.';
    document.getElementById('frase-motivacional').innerText = frase;
  }).catch(function() { document.getElementById('frase-motivacional').innerText = ''; });
}
